<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Seller</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-50 h-20 bg-white border-b border-slate-200 shadow-sm">
    </header>

    <!-- Navbar -->
    <nav class="h-16 bg-white border-b border-slate-200">
    </nav>

    <!-- Main -->
    <main class="max-w-7xl mx-auto p-6">

        <!-- Hero -->
        <section class="h-96 rounded-3xl mb-6 overflow-hidden shadow-xl bg-gradient-to-r from-slate-900 via-blue-800 to-blue-500">
        </section>

        <!-- Stats -->
        <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-6">

            <div class="h-40 bg-white rounded-3xl shadow-lg border border-slate-200"></div>

            <div class="h-40 bg-white rounded-3xl shadow-lg border border-slate-200"></div>

            <div class="h-40 bg-white rounded-3xl shadow-lg border border-slate-200"></div>

            <div class="h-40 bg-white rounded-3xl shadow-lg border border-slate-200"></div>

        </section>

        <!-- Product -->
        <section class="bg-white rounded-3xl shadow-lg border border-slate-200 min-h-[500px] mb-6">
        </section>

        <!-- Chart -->
        <section class="bg-white rounded-3xl shadow-lg border border-slate-200 min-h-[500px]">
        </section>

    </main>

    <!-- Footer -->
    <footer class="h-20 bg-white border-t border-slate-200">
    </footer>

</body>
</html>
