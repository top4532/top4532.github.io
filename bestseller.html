<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Seller Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="hero-header">
        <h1>Best Seller Products</h1>
        <p>ติดตามสินค้าขายดีและวิเคราะห์ยอดขาย</p>
    </header>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main>

        <!-- Statistics -->
        <section class="stats-section">

            <article class="card">
                <h2>150+</h2>
                <p>สินค้าขายดี</p>
            </article>

            <article class="card">
                <h2>25K</h2>
                <p>ยอดขายรวม</p>
            </article>

            <article class="card">
                <h2>98%</h2>
                <p>ความนิยม</p>
            </article>

        </section>

        <!-- Product List -->
        <section class="product-section">

            <h2>รายการสินค้าขายดี</h2>

            <article class="product-card">
                <h3>Product Name</h3>
                <p>รายละเอียดสินค้า</p>
            </article>

        </section>

    </main>

    <!-- =========================
         FOOTER
    ========================== -->
    <footer>
        <p>&copy; 2026 Best Seller Dashboard</p>
    </footer>

</body>

</html>
