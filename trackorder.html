<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Track Back Order - จัดการข้อมูล</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Prompt', sans-serif;
        }

        body {
            background: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }

        /* Split Layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ========= ด้านซ้าย - ตารางแสดงข้อมูล ========= */
        .left-panel {
            width: 55%;
            background: #f1f5f9;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #cbd5e1;
            overflow: hidden;
        }

        .left-header {
            background: #0f3b5f;
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .left-header h2 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-count {
            background: #facc15;
            color: #1e293b;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .data-table th {
            background: #e2e8f0;
            padding: 14px 12px;
            text-align: left;
            font-weight: 700;
            color: #1e293b;
            font-size: 0.85rem;
            position: sticky;
            top: 0;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #e9eef3;
            vertical-align: top;
            font-size: 0.85rem;
        }

        .data-table tr:hover {
            background: #fef9e3;
            cursor: pointer;
        }

        .data-table tr.selected {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
        }

        .barcode-mini {
            font-family: monospace;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .item-detail-list {
            font-size: 0.7rem;
            color: #475569;
        }

        .empty-table {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        /* ========= ด้านขวา - ฟอร์มเพิ่มข้อมูล ========= */
        .right-panel {
            width: 45%;
            background: white;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .form-header {
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .form-header h3 {
            font-size: 1.5rem;
            color: #0f3b5f;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
            font-size: 0.85rem;
        }

        input, .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        /* สินค้า dynamic */
        .items-section {
            margin: 20px 0;
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
        }

        .section-title {
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }

        .item-table th {
            background: #eef2ff;
            padding: 10px 8px;
            font-size: 0.8rem;
            text-align: left;
        }

        .item-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .item-table input {
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.85rem;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-icon-plus {
            color: #10b981;
        }

        .btn-icon-plus:hover {
            background: #d1fae5;
        }

        .btn-icon-remove {
            color: #ef4444;
        }

        .btn-icon-remove:hover {
            background: #fee2e2;
        }

        .btn-add-item {
            margin-top: 12px;
            background: #eff6ff;
            border: 1px dashed #3b82f6;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .btn-save {
            background: #0f3b5f;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-clear {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-delete-order {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }
            .left-panel, .right-panel {
                width: 100%;
                height: 50%;
            }
            body {
                overflow: auto;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- ด้านซ้าย: ตารางแสดงข้อมูล Back Order -->
    <div class="left-panel">
        <div class="left-header">
            <h2>📋 รายการ Back Order</h2>
            <div class="badge-count" id="totalOrdersBadge">0 รายการ</div>
        </div>
        <div class="table-wrapper">
            <table class="data-table" id="backorderListTable">
                <thead>
                    <tr>
                        <th>PRHQ</th>
                        <th>POHQ</th>
                        <th>จำนวนรายการ</th>
                        <th>บาร์โค้ดหลัก</th>
                        <th>จำนวนรวม</th>
                        <th>รายละเอียด</th>
                    </tr>
                </thead>
                <tbody id="backorderListBody">
                    <tr><td colspan="6" class="empty-table">ยังไม่มีข้อมูล Back Order<br>👉 เพิ่มทางด้านขวา</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ด้านขวา: ฟอร์มเพิ่ม/แก้ไข -->
    <div class="right-panel">
        <div class="form-header">
            <h3>➕ เพิ่ม / แก้ไข Back Order</h3>
            <p style="font-size:0.8rem; color:#475569;">คลิกที่แถวในตารางด้านซ้ายเพื่อแก้ไข</p>
        </div>

        <div class="form-group">
            <label>📌 PRHQ (เลขที่ใบขอซื้อ)</label>
            <input type="text" id="prhqInput" placeholder="เช่น PRHQ-2001" autocomplete="off">
        </div>
        <div class="form-group">
            <label>📌 POHQ (เลขที่ใบสั่งซื้อ)</label>
            <input type="text" id="pohqInput" placeholder="เช่น POHQ-7001" autocomplete="off">
        </div>

        <div class="items-section">
            <div class="section-title">
                <span>🧾 รายการสินค้า (บาร์โค้ด + จำนวน)</span>
                <button type="button" id="addItemRowBtn" class="btn-icon btn-icon-plus" style="font-size:1.5rem;">➕</button>
            </div>
            <table class="item-table" id="itemsDynamicTable">
                <thead>
                    <tr>
                        <th style="width: 55%">📦 บาร์โค้ด</th>
                        <th style="width: 30%">🔢 จำนวน</th>
                        <th style="width: 15%"></th>
                    </tr>
                </thead>
                <tbody id="itemsFormTbody">
                    <!-- dynamic rows -->
                </tbody>
            </table>
            <button type="button" id="addItemTextBtn" class="btn-add-item">
                ➕ เพิ่มรายการสินค้า
            </button>
        </div>

        <div class="form-actions">
            <button type="button" id="clearFormBtn" class="btn-clear">🗑️ ล้างฟอร์ม</button>
            <button type="button" id="deleteOrderBtn" class="btn-delete-order">❌ ลบออเดอร์นี้</button>
            <button type="button" id="saveOrderBtn" class="btn-save">💾 บันทึก / อัปเดต</button>
        </div>
    </div>
</div>

<script>
    // ---------- โครงสร้างข้อมูล ----------
    let backOrders = [];     // array ของออเดอร์ { id, prhq, pohq, items: [{barcode, qty}] }
    let currentEditId = null;  // null = โหมด新增, มีค่า = กำลังแก้ไขออเดอร์นั้น

    // Helper functions
    function calculateOrderStats(order) {
        const totalItems = order.items.length;
        const totalQty = order.items.reduce((sum, it) => sum + (parseInt(it.qty) || 0), 0);
        const firstBarcode = order.items.length > 0 ? order.items[0].barcode : "-";
        return { totalItems, totalQty, firstBarcode };
    }

    // เรนเดอร์ตารางด้านซ้าย
    function renderLeftTable() {
        const tbody = document.getElementById('backorderListBody');
        const badge = document.getElementById('totalOrdersBadge');
        badge.innerText = `${backOrders.length} รายการ`;

        if (backOrders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-table">ยังไม่มีข้อมูล Back Order<br>👉 เพิ่มทางด้านขวา</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        backOrders.forEach(order => {
            const { totalItems, totalQty, firstBarcode } = calculateOrderStats(order);
            const row = tbody.insertRow();
            row.setAttribute('data-id', order.id);
            if (currentEditId === order.id) {
                row.classList.add('selected');
            }
            row.insertCell(0).innerText = order.prhq;
            row.insertCell(1).innerText = order.pohq;
            row.insertCell(2).innerText = `${totalItems} รายการ`;
            row.insertCell(3).innerHTML = `<span class="barcode-mini">${firstBarcode}</span>`;
            row.insertCell(4).innerText = totalQty;
            // รายละเอียดสินค้าแบบย่อ
            let itemsShort = order.items.map(it => `${it.barcode}(${it.qty})`).join(', ');
            if (itemsShort.length > 40) itemsShort = itemsShort.slice(0, 37) + '...';
            row.insertCell(5).innerHTML = `<div class="item-detail-list">📦 ${itemsShort || '-'}</div>`;

            row.addEventListener('click', (e) => {
                e.stopPropagation();
                loadOrderToForm(order.id);
            });
        });
    }

    // โหลดออเดอร์ไปที่ฟอร์มด้านขวา (แก้ไข)
    function loadOrderToForm(orderId) {
        const order = backOrders.find(o => o.id === orderId);
        if (!order) return;
        currentEditId = order.id;
        document.getElementById('prhqInput').value = order.prhq;
        document.getElementById('pohqInput').value = order.pohq;
        // load items
        currentFormItems = JSON.parse(JSON.stringify(order.items)); // deep copy
        renderFormItems();
        renderLeftTable(); // re-render เพื่อ highlight แถวที่ถูกเลือก
    }

    // ตัวแปรเก็บ items ขณะกรอกในฟอร์ม
    let currentFormItems = [];   // [{barcode, qty}]

    function renderFormItems() {
        const tbody = document.getElementById('itemsFormTbody');
        if (!tbody) return;
        if (currentFormItems.length === 0) {
            currentFormItems = [{ barcode: "", qty: 1 }];
        }
        tbody.innerHTML = '';
        currentFormItems.forEach((item, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="form-barcode" data-idx="${idx}" value="${escapeHtml(item.barcode)}" placeholder="บาร์โค้ด เช่น 8851234567890"></td>
                <td><input type="number" class="form-qty" data-idx="${idx}" value="${item.qty}" min="1" step="1"></td>
                <td style="text-align:center;">
                    <button type="button" class="btn-icon btn-icon-remove" data-removeidx="${idx}">❌</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // attach events
        document.querySelectorAll('.form-barcode').forEach(inp => {
            inp.addEventListener('change', function() {
                const idx = parseInt(this.getAttribute('data-idx'));
                if (!isNaN(idx) && currentFormItems[idx]) currentFormItems[idx].barcode = this.value;
            });
            inp.addEventListener('input', function() {
                const idx = parseInt(this.getAttribute('data-idx'));
                if (!isNaN(idx) && currentFormItems[idx]) currentFormItems[idx].barcode = this.value;
            });
        });
        document.querySelectorAll('.form-qty').forEach(inp => {
            inp.addEventListener('change', function() {
                const idx = parseInt(this.getAttribute('data-idx'));
                if (!isNaN(idx) && currentFormItems[idx]) currentFormItems[idx].qty = parseInt(this.value) || 1;
            });
            inp.addEventListener('input', function() {
                const idx = parseInt(this.getAttribute('data-idx'));
                if (!isNaN(idx) && currentFormItems[idx]) currentFormItems[idx].qty = parseInt(this.value) || 1;
            });
        });

        // remove button
        document.querySelectorAll('.btn-icon-remove').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-removeidx'));
                if (currentFormItems.length > 1) {
                    currentFormItems.splice(idx, 1);
                    renderFormItems();
                } else {
                    alert("ต้องมีอย่างน้อย 1 รายการสินค้า");
                }
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // บันทึก (เพิ่มใหม่ หรือ อัปเดต)
    function saveOrder() {
        const prhq = document.getElementById('prhqInput').value.trim();
        const pohq = document.getElementById('pohqInput').value.trim();
        if (!prhq || !pohq) {
            alert("กรุณากรอก PRHQ และ POHQ");
            return;
        }
        // กรอง items ที่บาร์โค้ดไม่ว่าง
        let validItems = currentFormItems.filter(it => it.barcode.trim() !== "" && it.qty > 0);
        if (validItems.length === 0) {
            alert("กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ (บาร์โค้ดต้องไม่ว่าง)");
            return;
        }

        const newOrder = {
            id: currentEditId ? currentEditId : Date.now(),
            prhq: prhq,
            pohq: pohq,
            items: validItems.map(it => ({ barcode: it.barcode, qty: parseInt(it.qty) }))
        };

        if (currentEditId) {
            // อัปเดต
            const index = backOrders.findIndex(o => o.id === currentEditId);
            if (index !== -1) backOrders[index] = newOrder;
            alert("อัปเดต Back Order สำเร็จ");
        } else {
            // เพิ่มใหม่
            backOrders.unshift(newOrder);
            alert("เพิ่ม Back Order ใหม่สำเร็จ");
        }

        resetFormToNew();
        renderLeftTable();
    }

    // ลบออเดอร์ที่กำลังแก้ไข
    function deleteCurrentOrder() {
        if (!currentEditId) {
            alert("ไม่มีออเดอร์ที่ถูกเลือกให้ลบ กรุณาคลิกเลือกที่ตารางด้านซ้าย");
            return;
        }
        if (confirm("คุณต้องการลบ Back Order นี้ใช่หรือไม่?")) {
            backOrders = backOrders.filter(o => o.id !== currentEditId);
            resetFormToNew();
            renderLeftTable();
            alert("ลบเรียบร้อย");
        }
    }

    function resetFormToNew() {
        currentEditId = null;
        document.getElementById('prhqInput').value = '';
        document.getElementById('pohqInput').value = '';
        currentFormItems = [{ barcode: "", qty: 1 }];
        renderFormItems();
        renderLeftTable();  // เพื่อลบ highlight
    }

    function clearFormOnly() {
        if (confirm("ล้างข้อมูลที่กำลังกรอกในฟอร์ม?")) {
            currentEditId = null;
            document.getElementById('prhqInput').value = '';
            document.getElementById('pohqInput').value = '';
            currentFormItems = [{ barcode: "", qty: 1 }];
            renderFormItems();
            renderLeftTable();
        }
    }

    // เพิ่มแถวสินค้าใหม่ (ปุ่ม +)
    function addNewItemRow() {
        currentFormItems.push({ barcode: "", qty: 1 });
        renderFormItems();
    }

    // ตัวอย่างข้อมูลเริ่มต้น (mock data)
    function loadMockData() {
        backOrders = [
            {
                id: 1001,
                prhq: "PRHQ-1001",
                pohq: "POHQ-5001",
                items: [{ barcode: "8851904123456", qty: 12 }, { barcode: "8851904123457", qty: 5 }]
            },
            {
                id: 1002,
                prhq: "PRHQ-1002",
                pohq: "POHQ-5002",
                items: [{ barcode: "4901234567890", qty: 20 }, { barcode: "4901234567891", qty: 15 }, { barcode: "6934567890123", qty: 3 }]
            }
        ];
        resetFormToNew();
        renderLeftTable();
    }

    // Event Listeners
    document.getElementById('saveOrderBtn').addEventListener('click', saveOrder);
    document.getElementById('clearFormBtn').addEventListener('click', clearFormOnly);
    document.getElementById('deleteOrderBtn').addEventListener('click', deleteCurrentOrder);
    document.getElementById('addItemRowBtn').addEventListener('click', addNewItemRow);
    document.getElementById('addItemTextBtn').addEventListener('click', addNewItemRow);

    // เริ่มต้น
    loadMockData();
</script>
</body>
</html>
