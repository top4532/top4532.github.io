<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Track Back Order - จัดการข้อมูล</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Prompt', sans-serif;
        }

        body {
            background: #e0f2fe;
            height: 100vh;
            overflow: hidden;
        }

        /* Split Layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ========= ด้านซ้าย - ฟอร์มเพิ่มข้อมูล (สีฟ้าอ่อน) ========= */
        .left-panel {
            width: 45%;
            background: #f0f9ff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 2px solid #bae6fd;
            padding: 24px 28px;
        }

        .form-header {
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #7dd3fc;
        }

        .form-header h3 {
            font-size: 1.6rem;
            color: #0369a1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-header p {
            font-size: 0.85rem;
            color: #0c4a6e;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #075985;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #bae6fd;
            border-radius: 16px;
            font-size: 0.95rem;
            background: white;
            color: #1e293b;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14,165,233,0.2);
        }

        /* สินค้า dynamic */
        .items-section {
            margin: 20px 0;
            background: #ffffffcc;
            border-radius: 20px;
            padding: 20px 16px;
            border: 1px solid #bae6fd;
        }

        .section-title {
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #0369a1;
        }

        .item-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }

        .item-table th {
            background: #e0f2fe;
            padding: 12px 10px;
            font-size: 0.85rem;
            text-align: left;
            color: #075985;
            font-weight: 600;
        }

        .item-table td {
            padding: 10px 10px;
            border-bottom: 1px solid #e0f2fe;
            background: white;
        }

        .item-table input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-icon-plus {
            color: #0284c7;
            background: #e0f2fe;
        }

        .btn-icon-plus:hover {
            background: #bae6fd;
            transform: scale(1.05);
        }

        .btn-icon-remove {
            color: #dc2626;
        }

        .btn-icon-remove:hover {
            background: #fee2e2;
        }

        .btn-add-item {
            margin-top: 14px;
            background: #e0f2fe;
            border: 1px dashed #0284c7;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #0369a1;
            transition: 0.2s;
        }

        .btn-add-item:hover {
            background: #bae6fd;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn-save {
            background: #0284c7;
            color: white;
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-save:hover {
            background: #0369a1;
        }

        .btn-clear {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            color: #334155;
        }

        .btn-delete-order {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }

        /* ========= ด้านขวา - ตารางแสดงข้อมูล (สีฟ้าขาว) ========= */
        .right-panel {
            width: 55%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: -4px 0 12px rgba(0,0,0,0.03);
        }

        .right-header {
            background: #f0f9ff;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #bae6fd;
        }

        .right-header h2 {
            font-size: 1.4rem;
            color: #0369a1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-count {
            background: #0284c7;
            color: white;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #ffffff;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(2,132,199,0.08);
        }

        .data-table th {
            background: #e0f2fe;
            padding: 14px 12px;
            text-align: left;
            font-weight: 700;
            color: #075985;
            font-size: 0.85rem;
            position: sticky;
            top: 0;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
            font-size: 0.85rem;
            color: #1e293b;
        }

        .data-table tr:hover {
            background: #f0f9ff;
            cursor: pointer;
        }

        .data-table tr.selected {
            background: #e0f2fe;
            border-left: 4px solid #0284c7;
        }

        .barcode-mini {
            font-family: monospace;
            background: #e0f2fe;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #0369a1;
        }

        .item-detail-list {
            font-size: 0.7rem;
            color: #334155;
        }

        .empty-table {
            text-align: center;
            padding: 50px;
            color: #7dd3fc;
        }

        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }
            .left-panel, .right-panel {
                width: 100%;
                height: 50%;
            }
            body {
                overflow: auto;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- ด้านซ้าย: ฟอร์มเพิ่ม/แก้ไขข้อมูล -->
    <div class="left-panel">
        <div class="form-header">
            <h3>📝 เพิ่ม / แก้ไข Back Order</h3>
            <p>💡 คลิกที่แถวในตารางด้านขวาเพื่อแก้ไขข้อมูล</p>
        </div>

        <div class="form-group">
            <label>📌 PRHQ (เลขที่ใบขอซื้อ)</label>
            <input type="text" id="prhqInput" placeholder="เช่น PRHQ-2001" autocomplete="off">
        </div>
        <div class="form-group">
            <label>📌 POHQ (เลขที่ใบสั่งซื้อ)</label>
            <input type="text" id="pohqInput" placeholder="เช่น POHQ-7001" autocomplete="off">
        </div>

        <div class="items-section">
            <div class="section-title">
                <span>🧾 รายการสินค้า (บาร์โค้ด + จำนวน)</span>
                <button type="button" id="addItemRowBtn" class="btn-icon btn-icon-plus" style="font-size:1.5rem;">➕</button>
            </div>
            <table class="item-table" id="itemsDynamicTable">
                <thead>
                    <tr>
                        <th style="width: 55%">📦 บาร์โค้ด</th>
                        <th style="width: 30%">🔢 จำนวน</th>
                        <th style="width: 15%"></th>
                    </tr>
                </thead>
                <tbody id="itemsFormTbody">
                    <!-- dynamic rows -->
                </tbody>
            </table>
            <button type="button" id="addItemTextBtn" class="btn-add-item">
                ➕ เพิ่มรายการสินค้า
            </button>
        </div>

        <div class="form-actions">
            <button type="button" id="clearFormBtn" class="btn-clear">🗑️ ล้างฟอร์ม</button>
            <button type="button" id="deleteOrderBtn" class="btn-delete-order">❌ ลบออเดอร์นี้</button>
            <button type="button" id="saveOrderBtn" class="btn-save">💾 บันทึก / อัปเดต</button>
        </div>
    </div>

    <!-- ด้านขวา: ตารางแสดงข้อมูล Back Order -->
    <div class="right-panel">
        <div class="right-header">
            <h2>📋 รายการ Back Order ทั้งหมด</h2>
            <div class="badge-count" id="totalOrdersBadge">0 รายการ</div>
        </div>
        <div class="table-wrapper">
            <table class="data-table" id="backorderListTable">
                <thead>
                    <tr>
                        <th>PRHQ</th>
                        <th>POHQ</th>
                        <th>จำนวนรายการ</th>
                        <th>บาร์โค้ดหลัก</th>
                        <th>จำนวนรวม</th>
                        <th>รายละเอียดสินค้า</th>
                    </tr>
                </thead>
                <tbody id="backorderListBody">
                    <tr><td colspan="6" class="empty-table">ยังไม่มีข้อมูล Back Order<br>👉 เพิ่มข้อมูลทางด้านซ้าย</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ============ localStorage Management ============
    const STORAGE_KEY = 'backorder_data';

    // โหลดข้อมูลจาก localStorage
    function loadBackOrdersFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                return JSON.parse(stored);
            } catch(e) {
                console.error("Error parsing localStorage", e);
                return [];
            }
        }
        // ถ้าไม่มีข้อมูลใน localStorage ให้ใช้ตัวอย่างเริ่มต้น
        return getDefaultData();
    }

    // ข้อมูลตัวอย่างเริ่มต้น (ถ้ายังไม่มีใน localStorage)
    function getDefaultData() {
        return [
            {
                id: 1001,
                prhq: "PRHQ-1001",
                pohq: "POHQ-5001",
                items: [
                    { barcode: "8851904123456", qty: 12 },
                    { barcode: "8851904123457", qty: 5 }
                ]
            },
            {
                id: 1002,
                prhq: "PRHQ-1002",
                pohq: "POHQ-5002",
                items: [
                    { barcode: "4901234567890", qty: 20 },
                    { barcode: "4901234567891", qty: 15 },
                    { barcode: "6934567890123", qty: 3 }
                ]
            },
            {
                id: 1003,
                prhq: "PRHQ-1003",
                pohq: "POHQ-5003",
                items: [
                    { barcode: "1234567890123", qty: 8 }
                ]
            }
        ];
    }

    // บันทึกข้อมูลลง localStorage
    function saveBackOrdersToStorage(backOrders) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(backOrders));
    }

    // ============ Global Variables ============
    let backOrders = [];
    let currentEditId = null;
    let currentFormItems = [{ barcode: "", qty: 1 }];

    // Helper คำนวณสถิติ
    function calculateOrderStats(order) {
        const totalItems = order.items.length;
        const totalQty = order.items.reduce((sum, it) => sum + (parseInt(it.qty) || 0), 0);
        const firstBarcode = order.items.length > 0 ? order.items[0].barcode : "-";
        return { totalItems, totalQty, firstBarcode };
    }

    // เรนเดอร์ตารางด้านขวา
    function renderRightTable() {
        const tbody = document.getElementById('backorderListBody');
        const badge = document.getElementById('totalOrdersBadge');
        badge.innerText = `${backOrders.length} รายการ`;

        if (backOrders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-table">ยังไม่มีข้อมูล Back Order<br>👉 เพิ่มข้อมูลทางด้านซ้าย</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        backOrders.forEach(order => {
            const { totalItems, totalQty, firstBarcode } = calculateOrderStats(order);
            const row = tbody.insertRow();
            row.setAttribute('data-id', order.id);
            if (currentEditId === order.id) {
                row.classList.add('selected');
            }
            row.insertCell(0).innerText = order.prhq;
            row.insertCell(1).innerText = order.pohq;
            row.insertCell(2).innerText = `${totalItems} รายการ`;
            row.insertCell(3).innerHTML = `<span class="barcode-mini">${escapeHtml(firstBarcode)}</span>`;
            row.insertCell(4).innerText = totalQty;
            let itemsShort = order.items.map(it => `${it.barcode}(${it.qty})`).join(', ');
            if (itemsShort.length > 45) itemsShort = itemsShort.slice(0, 42) + '...';
            row.insertCell(5).innerHTML = `<div class="item-detail-list">📦 ${escapeHtml(itemsShort) || '-'}</div>`;

            row.addEventListener('click', (e) => {
                e.stopPropagation();
                loadOrderToForm(order.id);
            });
        });
    }

    // โหลดออเดอร์ไปฟอร์มซ้าย
    function loadOrderToForm(orderId) {
        const order = backOrders.find(o => o.id === orderId);
        if (!order) return;
        currentEditId = order.id;
        document.getElementById('prhqInput').value = order.prhq;
        document.getElementById('pohqInput').value = order.pohq;
        currentFormItems = JSON.parse(JSON.stringify(order.items));
        if (currentFormItems.length === 0) currentFormItems = [{ barcode: "", qty: 1 }];
        renderFormItems();
        renderRightTable();
    }

    // เรนเดอร์ฟอร์มรายการสินค้า
    function renderFormItems() {
        const tbody = document.getElementById('itemsFormTbody');
        if (!tbody) return;
        if (currentFormItems.length === 0) {
            currentFormItems = [{ barcode: "", qty: 1 }];
        }
        tbody.innerHTML = '';
        currentFormItems.forEach((item, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="form-barcode" data-idx="${idx}" value="${escapeHtml(item.barcode)}" placeholder="บาร์โค้ด เช่น 8851234567890"></td>
                <td><input type="number" class="form-qty" data-idx="${idx}" value="${item.qty}" min="1" step="1"></td>
                <td style="text-align:center;">
                    <button type="button" class="btn-icon btn-icon-remove" data-removeidx="${idx}">❌</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.querySelectorAll('.form-barcode').forEach(inp => {
            inp.addEventListener('change', function() {
                const idx = parseInt(this.getAttribute('data-idx'));
                if (!isNaN(idx) && currentFormItems[idx]) currentFormItems[idx].barcode = this.value;
            });
            inp.addEventListener('input', function() {
                const idx = parseInt(this.getAttribute('data-idx'));
                if (!isNaN(idx) && currentFormItems[idx]) currentFormItems[idx].barcode = this.value;
            });
        });
        document.querySelectorAll('.form-qty').forEach(inp => {
            inp.addEventListener('change', function() {
                const idx = parseInt(this.getAttribute('data-idx'));
                if (!isNaN(idx) && currentFormItems[idx]) currentFormItems[idx].qty = parseInt(this.value) || 1;
            });
            inp.addEventListener('input', function() {
                const idx = parseInt(this.getAttribute('data-idx'));
                if (!isNaN(idx) && currentFormItems[idx]) currentFormItems[idx].qty = parseInt(this.value) || 1;
            });
        });

        document.querySelectorAll('.btn-icon-remove').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-removeidx'));
                if (currentFormItems.length > 1) {
                    currentFormItems.splice(idx, 1);
                    renderFormItems();
                } else {
                    alert("ต้องมีอย่างน้อย 1 รายการสินค้า");
                }
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // บันทึก (เพิ่ม/แก้ไข)
    function saveOrder() {
        const prhq = document.getElementById('prhqInput').value.trim();
        const pohq = document.getElementById('pohqInput').value.trim();
        if (!prhq || !pohq) {
            alert("กรุณากรอก PRHQ และ POHQ");
            return;
        }
        let validItems = currentFormItems.filter(it => it.barcode.trim() !== "" && it.qty > 0);
        if (validItems.length === 0) {
            alert("กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ (บาร์โค้ดต้องไม่ว่าง)");
            return;
        }

        const newOrder = {
            id: currentEditId ? currentEditId : Date.now(),
            prhq: prhq,
            pohq: pohq,
            items: validItems.map(it => ({ barcode: it.barcode, qty: parseInt(it.qty) }))
        };

        if (currentEditId) {
            // อัปเดต
            const index = backOrders.findIndex(o => o.id === currentEditId);
            if (index !== -1) backOrders[index] = newOrder;
            alert("✅ อัปเดต Back Order สำเร็จ");
        } else {
            // เพิ่มใหม่
            backOrders.unshift(newOrder);
            alert("✅ เพิ่ม Back Order ใหม่สำเร็จ");
        }
        
        // บันทึกข้อมูลลง localStorage
        saveBackOrdersToStorage(backOrders);
        resetFormToNew();
        renderRightTable();
    }

    function deleteCurrentOrder() {
        if (!currentEditId) {
            alert("⚠️ ไม่มีออเดอร์ที่ถูกเลือก กรุณาคลิกเลือกที่ตารางด้านขวา");
            return;
        }
        if (confirm("ยืนยันลบ Back Order นี้?")) {
            backOrders = backOrders.filter(o => o.id !== currentEditId);
            // บันทึกข้อมูลลง localStorage
            saveBackOrdersToStorage(backOrders);
            resetFormToNew();
            renderRightTable();
            alert("🗑️ ลบเรียบร้อย");
        }
    }

    function resetFormToNew() {
        currentEditId = null;
        document.getElementById('prhqInput').value = '';
        document.getElementById('pohqInput').value = '';
        currentFormItems = [{ barcode: "", qty: 1 }];
        renderFormItems();
        renderRightTable();
    }

    function clearFormOnly() {
        if (confirm("ล้างข้อมูลที่กำลังกรอกในฟอร์ม?")) {
            currentEditId = null;
            document.getElementById('prhqInput').value = '';
            document.getElementById('pohqInput').value = '';
            currentFormItems = [{ barcode: "", qty: 1 }];
            renderFormItems();
            renderRightTable();
        }
    }

    function addNewItemRow() {
        currentFormItems.push({ barcode: "", qty: 1 });
        renderFormItems();
    }

    // โหลดข้อมูลเริ่มต้น
    function init() {
        backOrders = loadBackOrdersFromStorage();
        // ตรวจสอบว่ามี id ซ้ำไหม (กัน error)
        if (backOrders.length === 0) {
            backOrders = getDefaultData();
            saveBackOrdersToStorage(backOrders);
        }
        resetFormToNew();
        renderRightTable();
    }

    // Event Listeners
    document.getElementById('saveOrderBtn').addEventListener('click', saveOrder);
    document.getElementById('clearFormBtn').addEventListener('click', clearFormOnly);
    document.getElementById('deleteOrderBtn').addEventListener('click', deleteCurrentOrder);
    document.getElementById('addItemRowBtn').addEventListener('click', addNewItemRow);
    document.getElementById('addItemTextBtn').addEventListener('click', addNewItemRow);

    // เริ่มต้น
    init();
</script>
</body>
</html>
