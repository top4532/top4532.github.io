<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Back Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --b50:#EFF6FF;--b100:#DBEAFE;--b200:#BFDBFE;--b300:#93C5FD;
  --b400:#60A5FA;--b500:#3B82F6;--b600:#2563EB;--b700:#1D4ED8;
  --b800:#1E40AF;--b900:#1E3A8A;--b950:#172554;
  --white:#ffffff;--slate50:#F8FAFC;--slate100:#F1F5F9;
  --slate200:#E2E8F0;--slate300:#CBD5E1;--slate400:#94A3B8;
  --slate500:#64748B;--slate600:#475569;--slate700:#334155;
  --slate800:#1E293B;
  --green:#10B981;--red:#EF4444;--amber:#F59E0B;
  --ff:'Sarabun',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ff);background:var(--b50);color:var(--slate800);font-size:14px;line-height:1.5}

/* HEADER */
.hdr{
  height:64px;background:var(--white);
  border-bottom:1px solid var(--b200);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  position:relative;z-index:10;
}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--b600),var(--b400),var(--b300))}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--b600),var(--b400));
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-logo svg{width:20px;height:20px;stroke:white;fill:none;stroke-width:1.8}
.brand-text h1{font-size:17px;font-weight:700;color:var(--b900);letter-spacing:-0.01em}
.brand-text p{font-size:11px;color:var(--b500);font-weight:500;letter-spacing:0.06em;text-transform:uppercase;margin-top:1px}
.hdr-stats{display:flex;gap:24px;align-items:center}
.hdr-stat{text-align:center}
.hdr-stat-val{font-size:20px;font-weight:700;color:var(--b700);line-height:1}
.hdr-stat-lbl{font-size:10px;color:var(--slate400);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px}
.hdr-divider{width:1px;height:32px;background:var(--b100)}
.btn-back{
  display:flex;align-items:center;gap:7px;
  background:var(--b50);border:1px solid var(--b200);
  color:var(--b700);padding:8px 18px;border-radius:10px;
  cursor:pointer;font-family:var(--ff);font-size:13px;font-weight:600;
  transition:all 0.15s;
}
.btn-back:hover{background:var(--b100);border-color:var(--b300)}
.btn-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}

/* LAYOUT */
.app{display:grid;grid-template-columns:420px 1fr;gap:0;height:calc(100vh - 64px)}

/* SIDEBAR */
.sidebar{
  background:var(--white);border-right:1px solid var(--b100);
  display:flex;flex-direction:column;overflow:hidden;
}
.sb-top{
  background:linear-gradient(160deg,var(--b900) 0%,var(--b700) 100%);
  padding:24px 24px 20px;
  position:relative;overflow:hidden;
}
.sb-top::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,0.05);
}
.sb-top::after{
  content:'';position:absolute;bottom:-60px;left:-20px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,0.03);
}
.sb-title{font-size:16px;font-weight:700;color:white;position:relative;z-index:1}
.sb-sub{font-size:12px;color:rgba(255,255,255,0.55);margin-top:3px;position:relative;z-index:1}
.mode-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
  color:white;font-size:11px;font-weight:600;padding:4px 12px;
  border-radius:20px;margin-top:12px;position:relative;z-index:1;letter-spacing:0.04em;
}
.mode-pill.edit-mode{background:rgba(251,191,36,0.25);border-color:rgba(251,191,36,0.5);color:#FDE68A}
.mode-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.6)}
.mode-dot.active{background:#34D399}
.mode-dot.edit-active{background:#FDE68A}

.sb-body{flex:1;overflow-y:auto;padding:20px 20px 16px;display:flex;flex-direction:column;gap:16px}

/* FORM FIELD */
.field-group{display:flex;flex-direction:column;gap:5px}
.field-lbl{font-size:11px;font-weight:700;color:var(--b700);letter-spacing:0.07em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.field-lbl svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.field-inp{
  width:100%;padding:10px 14px;
  border:1.5px solid var(--b200);border-radius:10px;
  font-family:var(--ff);font-size:14px;font-weight:500;color:var(--slate800);
  background:var(--b50);outline:none;transition:all 0.15s;
}
.field-inp::placeholder{color:var(--slate300);font-weight:400}
.field-inp:focus{border-color:var(--b500);background:var(--white);box-shadow:0 0 0 3px rgba(59,130,246,0.12)}
.field-inp:hover:not(:focus){border-color:var(--b300)}

/* ITEMS SECTION */
.items-card{
  border:1.5px solid var(--b200);border-radius:14px;overflow:hidden;
  background:var(--white);
}
.items-card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--b50);border-bottom:1px solid var(--b100);
}
.items-card-hdr-lbl{font-size:11px;font-weight:700;color:var(--b700);letter-spacing:0.06em;text-transform:uppercase}
.btn-add-row{
  width:28px;height:28px;border-radius:8px;
  background:var(--b600);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;
}
.btn-add-row:hover{background:var(--b700);transform:scale(1.05)}
.btn-add-row svg{width:13px;height:13px;stroke:white;fill:none;stroke-width:2.5}

.items-tbl{width:100%;border-collapse:collapse}
.items-tbl th{
  padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:0.07em;
  text-transform:uppercase;color:var(--slate400);background:var(--slate50);
  border-bottom:1px solid var(--b100);text-align:left;
}
.items-tbl td{padding:5px 8px;border-bottom:1px solid var(--b50)}
.items-tbl tr:last-child td{border-bottom:none}
.items-tbl tr:hover td{background:var(--b50)}
.tbl-inp{
  width:100%;padding:7px 10px;border:1.5px solid transparent;
  border-radius:8px;font-family:var(--fm);font-size:12px;
  color:var(--slate800);background:transparent;outline:none;transition:all 0.12s;
}
.tbl-inp:focus{border-color:var(--b400);background:var(--b50)}
.tbl-inp:hover:not(:focus){background:var(--b50)}
.btn-rm-row{
  width:26px;height:26px;border:none;background:none;border-radius:7px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--slate300);transition:all 0.12s;margin:auto;
}
.btn-rm-row:hover{background:var(--red);color:white}
.btn-rm-row svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5}

/* ACTIONS */
.sb-actions{
  padding:16px 20px;border-top:1px solid var(--b100);
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.sb-actions-bottom{display:flex;gap:8px;grid-column:1/-1}
.action-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:10px;cursor:pointer;
  font-family:var(--ff);font-size:13px;font-weight:600;
  padding:10px 16px;transition:all 0.15s;
}
.action-btn:active{transform:scale(0.97)}
.action-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.btn-save{
  background:linear-gradient(135deg,var(--b600),var(--b500));
  color:white;grid-column:1/-1;padding:12px;font-size:14px;
  box-shadow:0 4px 14px rgba(37,99,235,0.35);
}
.btn-save:hover{box-shadow:0 6px 20px rgba(37,99,235,0.45);transform:translateY(-1px)}
.btn-save:active{transform:scale(0.98)}
.btn-clear{background:var(--slate100);color:var(--slate600)}
.btn-clear:hover{background:var(--slate200)}
.btn-delete{background:rgba(239,68,68,0.08);color:var(--red)}
.btn-delete:hover{background:rgba(239,68,68,0.16)}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--slate50)}

/* TOP BAR */
.main-top{
  background:var(--white);border-bottom:1px solid var(--b100);
  padding:14px 24px;display:flex;flex-direction:column;gap:12px;
}
.search-row{display:flex;gap:8px;align-items:center}
.search-box{
  flex:1;position:relative;
}
.search-box input{
  width:100%;padding:10px 14px 10px 40px;
  border:1.5px solid var(--b200);border-radius:10px;
  font-family:var(--ff);font-size:13px;color:var(--slate800);
  background:var(--b50);outline:none;transition:all 0.15s;
}
.search-box input:focus{border-color:var(--b500);background:white;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.search-box-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--slate300);pointer-events:none;
}
.search-box-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.search-btn-go{
  background:var(--b600);color:white;border:none;
  padding:10px 20px;border-radius:10px;font-family:var(--ff);
  font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.search-btn-go:hover{background:var(--b700)}
.search-btn-clr{
  background:var(--slate100);border:1px solid var(--slate200);
  color:var(--slate600);padding:10px 14px;border-radius:10px;
  font-family:var(--ff);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.search-btn-clr:hover{background:var(--slate200)}
.meta-row{display:flex;align-items:center;justify-content:space-between}
.count-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--b900);color:white;
  font-size:12px;font-weight:600;padding:5px 14px;border-radius:20px;letter-spacing:0.03em;
}
.count-tag-dot{width:6px;height:6px;border-radius:50%;background:var(--b300)}
.top-btns{display:flex;gap:8px}
.top-btn{
  display:flex;align-items:center;gap:5px;
  border:none;border-radius:8px;cursor:pointer;
  font-family:var(--ff);font-size:12px;font-weight:600;
  padding:6px 14px;transition:all 0.15s;letter-spacing:0.02em;
}
.top-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.top-btn-sample{background:var(--b100);color:var(--b800)}
.top-btn-sample:hover{background:var(--b200)}
.top-btn-reset{background:rgba(245,158,11,0.12);color:#92400E}
.top-btn-reset:hover{background:rgba(245,158,11,0.22)}

/* TABLE */
.table-area{flex:1;overflow-y:auto;padding:20px 24px}
.data-wrap{border-radius:16px;overflow:hidden;border:1.5px solid var(--b100);background:var(--white)}
.data-tbl{width:100%;border-collapse:collapse}
.data-tbl thead th{
  padding:12px 14px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.07em;
  color:var(--b700);background:var(--b50);
  border-bottom:2px solid var(--b200);text-align:left;white-space:nowrap;
}
.data-tbl tbody tr{cursor:pointer;transition:background 0.1s;border-bottom:1px solid var(--b50)}
.data-tbl tbody tr:last-child{border-bottom:none}
.data-tbl tbody tr:hover{background:linear-gradient(90deg,var(--b50),transparent)}
.data-tbl tbody tr.row-selected{
  background:linear-gradient(90deg,var(--b100),var(--b50));
  border-left:3px solid var(--b500);
}
.data-tbl td{padding:13px 14px;vertical-align:middle;font-size:13px;color:var(--slate700)}
.cell-mono{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--b800)}
.cell-pill{
  display:inline-block;font-family:var(--fm);font-size:11px;
  background:var(--b50);color:var(--b800);
  border:1px solid var(--b200);border-radius:6px;
  padding:3px 8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cell-count{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;
  background:var(--b100);color:var(--b800);
  font-size:12px;font-weight:700;
}
.cell-qty{
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--b600),var(--b500));
  color:white;font-size:12px;font-weight:700;
  min-width:36px;padding:3px 10px;border-radius:20px;
}
.cell-detail{font-size:11px;color:var(--slate400);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{padding:80px 20px;text-align:center}
.empty-ico{
  width:64px;height:64px;border-radius:20px;
  background:var(--b100);margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
}
.empty-ico svg{width:28px;height:28px;stroke:var(--b400);fill:none;stroke-width:1.5}
.empty h3{font-size:16px;font-weight:700;color:var(--b900);margin-bottom:6px}
.empty p{font-size:13px;color:var(--slate400)}

/* TOAST */
#toast-root{
  position:fixed;bottom:28px;right:28px;z-index:9999;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--slate800);color:white;
  padding:14px 16px 14px 14px;border-radius:14px;
  min-width:280px;max-width:360px;
  pointer-events:all;position:relative;overflow:hidden;
  transform:translateX(20px);opacity:0;
  animation:tin 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
.toast.tout{animation:tout 0.25s ease-in forwards}
.toast-stripe{
  position:absolute;bottom:0;left:0;height:3px;width:100%;
  animation:tprog 3.2s linear forwards;
}
.toast-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-ic svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2.2}
.toast-body{flex:1;min-width:0}
.toast-title{font-size:13px;font-weight:700;color:white;line-height:1.3}
.toast-msg{font-size:12px;color:rgba(255,255,255,0.6);margin-top:3px;line-height:1.4}
.toast-close{
  background:none;border:none;color:rgba(255,255,255,0.4);
  cursor:pointer;padding:2px;border-radius:5px;transition:color 0.15s;font-size:16px;
  line-height:1;align-self:flex-start;
}
.toast-close:hover{color:white}
@keyframes tin{to{transform:translateX(0);opacity:1}}
@keyframes tout{to{transform:translateX(20px);opacity:0}}
@keyframes tprog{from{width:100%}to{width:0}}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b200);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--b300)}

/* SELECTED ROW INDICATOR */
.selected-indicator{
  display:none;padding:10px 14px;
  background:linear-gradient(90deg,var(--b800),var(--b700));
  border-radius:0 0 0 0;
}
.selected-indicator.show{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sel-text{font-size:12px;color:rgba(255,255,255,0.8);font-weight:500}
.sel-id{font-family:var(--fm);font-size:12px;color:white;font-weight:600}

@media(max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  html,body{height:auto;overflow:auto}
  .sidebar{height:auto;max-height:none}
  .main{height:80vh}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M6 7h12M6 11h8"/></svg>
    </div>
    <div class="brand-text">
      <h1>Track Back Order</h1>
      <p>ระบบจัดการ Back Order</p>
    </div>
  </div>
  <div class="hdr-stats">
    <div class="hdr-stat">
      <div class="hdr-stat-val" id="hdrTotal">0</div>
      <div class="hdr-stat-lbl">ออเดอร์ทั้งหมด</div>
    </div>
    <div class="hdr-divider"></div>
    <div class="hdr-stat">
      <div class="hdr-stat-val" id="hdrItems">0</div>
      <div class="hdr-stat-lbl">รายการสินค้า</div>
    </div>
    <div class="hdr-divider"></div>
    <div class="hdr-stat">
      <div class="hdr-stat-val" id="hdrQty">0</div>
      <div class="hdr-stat-lbl">จำนวนรวม</div>
    </div>
  </div>
  <button class="btn-back" id="btnBack">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    ย้อนกลับ
  </button>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sb-top">
      <div class="sb-title">เพิ่ม / แก้ไข Back Order</div>
      <div class="sb-sub">กรอกข้อมูลด้านล่างหรือคลิกแถวในตาราง</div>
      <div class="mode-pill" id="modePill">
        <div class="mode-dot" id="modeDot"></div>
        <span id="modeText">โหมดเพิ่มใหม่</span>
      </div>
    </div>

    <div class="sb-body">
      <div class="field-group">
        <label class="field-lbl">
          <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
          PRHQ — เลขที่ใบขอซื้อ
        </label>
        <input class="field-inp" id="inpPRHQ" type="text" placeholder="เช่น PRHQ-2001" autocomplete="off">
      </div>
      <div class="field-group">
        <label class="field-lbl">
          <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          POHQ — เลขที่ใบสั่งซื้อ
        </label>
        <input class="field-inp" id="inpPOHQ" type="text" placeholder="เช่น POHQ-7001" autocomplete="off">
      </div>

      <div class="items-card">
        <div class="items-card-hdr">
          <span class="items-card-hdr-lbl">รายการสินค้า (บาร์โค้ด + จำนวน)</span>
          <button class="btn-add-row" id="btnAddRow" type="button" title="เพิ่มรายการ">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <table class="items-tbl">
          <thead>
            <tr>
              <th style="width:56%">บาร์โค้ด</th>
              <th style="width:28%">จำนวน</th>
              <th style="width:16%"></th>
            </tr>
          </thead>
          <tbody id="itemsTbody"></tbody>
        </table>
      </div>
    </div>

    <div class="selected-indicator" id="selIndicator">
      <div>
        <div class="sel-text">กำลังแก้ไขออเดอร์</div>
        <div class="sel-id" id="selId">—</div>
      </div>
    </div>

    <div class="sb-actions">
      <button class="action-btn btn-save" id="btnSave" type="button">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        บันทึก / อัปเดต
      </button>
      <button class="action-btn btn-clear" id="btnClear" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14H6L5 6M9 6V4h6v2"/></svg>
        ล้างฟอร์ม
      </button>
      <button class="action-btn btn-delete" id="btnDelete" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        ลบออเดอร์นี้
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="main-top">
      <div class="search-row">
        <div class="search-box">
          <div class="search-box-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
          <input type="text" id="inpSearch" placeholder="ค้นหา PRHQ หรือ POHQ…">
        </div>
        <button class="search-btn-go" id="btnSearch">ค้นหา</button>
        <button class="search-btn-clr" id="btnClearSearch">ล้าง</button>
      </div>
      <div class="meta-row">
        <div class="count-tag">
          <div class="count-tag-dot"></div>
          <span id="countLabel">0 รายการ</span>
        </div>
        <div class="top-btns">
          <button class="top-btn top-btn-sample" id="btnSample" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            เพิ่มตัวอย่าง
          </button>
          <button class="top-btn top-btn-reset" id="btnReset" type="button">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14H6L5 6M9 6V4h6v2"/></svg>
            ลบทั้งหมด
          </button>
        </div>
      </div>
    </div>

    <div class="table-area">
      <div class="data-wrap">
        <table class="data-tbl">
          <thead>
            <tr>
              <th>PRHQ</th>
              <th>POHQ</th>
              <th style="text-align:center">รายการ</th>
              <th>บาร์โค้ดหลัก</th>
              <th style="text-align:center">รวม</th>
              <th>รายละเอียด</th>
            </tr>
          </thead>
          <tbody id="ordersTbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div id="toast-root"></div>

<script>
const SK='bo_v3';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

let orders=[], editId=null, items=[{b:'',q:'1'}], kw='';

function load(){try{return JSON.parse(localStorage.getItem(SK))||[]}catch{return[]}}
function save(){localStorage.setItem(SK,JSON.stringify(orders))}

/* TOAST */
function toast(type,title,msg){
  const root=$('toast-root');
  const colors={success:'#10B981',error:'#EF4444',info:'#3B82F6'};
  const icons={
    success:'<polyline points="20 6 9 17 4 12"/>',
    error:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
  };
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`
    <div class="toast-ic" style="background:${colors[type]}">
      <svg viewBox="0 0 24 24">${icons[type]}</svg>
    </div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      ${msg?`<div class="toast-msg">${msg}</div>`:''}
    </div>
    <button class="toast-close" onclick="this.closest('.toast').classList.add('tout');setTimeout(()=>this.closest('.toast').remove(),300)">×</button>
    <div class="toast-stripe" style="background:${colors[type]}"></div>
  `;
  root.appendChild(el);
  setTimeout(()=>{el.classList.add('tout');setTimeout(()=>el.remove(),300)},3200);
}

/* FORM ITEMS */
function renderItems(){
  const tb=$('itemsTbody');
  if(!items.length)items=[{b:'',q:'1'}];
  tb.innerHTML='';
  items.forEach((it,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><input class="tbl-inp fi-b" data-i="${i}" value="${esc(it.b)}" placeholder="8851234567890" spellcheck="false"></td>
      <td><input class="tbl-inp fi-q" data-i="${i}" value="${it.q}" inputmode="numeric" pattern="[0-9]*" style="text-align:center"></td>
      <td style="text-align:center">
        <button class="btn-rm-row fi-rm" data-i="${i}" type="button">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('.fi-b').forEach(inp=>{
    inp.oninput=function(){const i=+this.dataset.i;if(items[i])items[i].b=this.value};
  });
  tb.querySelectorAll('.fi-q').forEach(inp=>{
    inp.oninput=function(){
      this.value=this.value.replace(/[^0-9]/g,'');
      const i=+this.dataset.i;if(items[i])items[i].q=this.value||'1';
    };
    inp.onblur=function(){
      let v=Math.max(1,parseInt(this.value)||1);
      const i=+this.dataset.i;if(items[i]){items[i].q=String(v);this.value=v}
    };
  });
  tb.querySelectorAll('.fi-rm').forEach(btn=>{
    btn.onclick=function(){
      if(items.length<=1){toast('error','ต้องมีอย่างน้อย 1 รายการ');return}
      items.splice(+this.dataset.i,1);renderItems();
    };
  });
}

/* MODE PILL */
function setMode(isEdit,prhq){
  const pill=$('modePill'),dot=$('modeDot'),txt=$('modeText');
  const ind=$('selIndicator'),sid=$('selId');
  if(isEdit){
    pill.className='mode-pill edit-mode';
    dot.className='mode-dot edit-active';
    txt.textContent='โหมดแก้ไข';
    ind.className='selected-indicator show';
    sid.textContent=prhq||'—';
  }else{
    pill.className='mode-pill';
    dot.className='mode-dot active';
    txt.textContent='โหมดเพิ่มใหม่';
    ind.className='selected-indicator';
    sid.textContent='—';
  }
}

/* TABLE */
function display(){return kw.trim()?orders.filter(o=>o.prhq.toLowerCase().includes(kw.toLowerCase())||o.pohq.toLowerCase().includes(kw.toLowerCase())):orders}

function updateStats(){
  const totalOrders=orders.length;
  const totalItems=orders.reduce((s,o)=>s+o.items.length,0);
  const totalQty=orders.reduce((s,o)=>s+o.items.reduce((a,it)=>a+(parseInt(it.qty)||0),0),0);
  $('hdrTotal').textContent=totalOrders;
  $('hdrItems').textContent=totalItems;
  $('hdrQty').textContent=totalQty;
}

function renderTable(){
  const list=display();
  $('countLabel').textContent=`${list.length} รายการ`;
  updateStats();
  const tb=$('ordersTbody');
  if(!list.length){
    tb.innerHTML=`<tr><td colspan="6"><div class="empty">
      <div class="empty-ico"><svg viewBox="0 0 24 24"><path d="M20 7H4c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM4 5h16M9 5V3M15 5V3"/></svg></div>
      <h3>${kw?'ไม่พบรายการที่ค้นหา':'ยังไม่มีข้อมูล Back Order'}</h3>
      <p>${kw?'ลองค้นหาด้วยคำอื่น':'กรอกข้อมูลทางด้านซ้ายหรือกดเพิ่มตัวอย่าง'}</p>
    </div></td></tr>`;
    return;
  }
  tb.innerHTML='';
  list.forEach(o=>{
    const total=o.items.reduce((s,it)=>s+(parseInt(it.qty)||0),0);
    const first=o.items[0]?.barcode||'—';
    const detail=o.items.map(it=>`${it.barcode}(${it.qty})`).join(', ');
    const tr=document.createElement('tr');
    if(editId===o.id)tr.className='row-selected';
    tr.innerHTML=`
      <td><span class="cell-mono">${esc(o.prhq)}</span></td>
      <td><span class="cell-mono">${esc(o.pohq)}</span></td>
      <td style="text-align:center"><span class="cell-count">${o.items.length}</span></td>
      <td><span class="cell-pill" title="${esc(first)}">${esc(first)}</span></td>
      <td style="text-align:center"><span class="cell-qty">${total}</span></td>
      <td><div class="cell-detail" title="${esc(detail)}">${esc(detail)||'—'}</div></td>`;
    tr.onclick=()=>loadToForm(o.id);
    tb.appendChild(tr);
  });
}

function loadToForm(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  editId=o.id;
  $('inpPRHQ').value=o.prhq;$('inpPOHQ').value=o.pohq;
  items=JSON.parse(JSON.stringify(o.items.length?o.items:[{barcode:'',qty:'1'}])).map(it=>({b:it.barcode,q:String(it.qty)}));
  renderItems();setMode(true,o.prhq);renderTable();
}

function resetForm(){
  editId=null;$('inpPRHQ').value='';$('inpPOHQ').value='';
  items=[{b:'',q:'1'}];renderItems();setMode(false);renderTable();
}

function doSave(){
  const prhq=$('inpPRHQ').value.trim();
  const pohq=$('inpPOHQ').value.trim();
  if(!prhq||!pohq){toast('error','กรุณากรอก PRHQ และ POHQ');return}
  const valid=items.filter(it=>it.b.trim()&&parseInt(it.q)>0);
  if(!valid.length){toast('error','กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ','บาร์โค้ดต้องไม่ว่างเปล่า');return}
  const order={id:editId||Date.now(),prhq,pohq,items:valid.map(it=>({barcode:it.b.trim(),qty:parseInt(it.q)||1}))};
  if(editId){
    const idx=orders.findIndex(x=>x.id===editId);
    if(idx!==-1)orders[idx]=order;
    toast('success','อัปเดต Back Order สำเร็จ',`${prhq} → ${pohq}`);
  }else{
    orders.unshift(order);
    toast('success','เพิ่ม Back Order ใหม่สำเร็จ',`${prhq} · ${valid.length} รายการสินค้า`);
  }
  save();resetForm();
}

function doDelete(){
  if(!editId){toast('info','ยังไม่ได้เลือกออเดอร์','คลิกที่แถวในตารางเพื่อเลือก');return}
  const o=orders.find(x=>x.id===editId);
  if(!confirm(`ยืนยันลบออเดอร์ "${o?.prhq}"?`))return;
  orders=orders.filter(x=>x.id!==editId);
  save();resetForm();
  toast('info','ลบออเดอร์เรียบร้อยแล้ว');
}

function doSample(){
  if(orders.length&&!confirm('มีข้อมูลอยู่แล้ว ต้องการเพิ่มตัวอย่างเพิ่มเติมหรือไม่?'))return;
  const n=Date.now();
  [
    {id:n+1,prhq:'PRHQ-1001',pohq:'POHQ-5001',items:[{barcode:'8851904123456',qty:12},{barcode:'8851904123457',qty:5}]},
    {id:n+2,prhq:'PRHQ-1002',pohq:'POHQ-5002',items:[{barcode:'4901234567890',qty:20},{barcode:'4901234567891',qty:15},{barcode:'6934567890123',qty:3}]},
    {id:n+3,prhq:'PRHQ-1003',pohq:'POHQ-5003',items:[{barcode:'1234567890123',qty:8}]}
  ].forEach(s=>orders.push(s));
  save();resetForm();
  toast('success','เพิ่มข้อมูลตัวอย่าง 3 รายการ');
}

/* EVENTS */
$('btnSave').onclick=doSave;
$('btnClear').onclick=()=>{if(confirm('ล้างฟอร์ม?'))resetForm()};
$('btnDelete').onclick=doDelete;
$('btnAddRow').onclick=()=>{items.push({b:'',q:'1'});renderItems()};
$('btnSample').onclick=doSample;
$('btnReset').onclick=()=>{
  if(!confirm('⚠️ ลบข้อมูลทั้งหมด? ไม่สามารถกู้คืนได้'))return;
  orders=[];save();resetForm();
  toast('info','ลบข้อมูลทั้งหมดเรียบร้อย');
};
$('btnSearch').onclick=()=>{kw=$('inpSearch').value;renderTable()};
$('btnClearSearch').onclick=()=>{$('inpSearch').value='';kw='';renderTable()};
$('inpSearch').onkeypress=e=>{if(e.key==='Enter'){kw=e.target.value;renderTable()}};
$('btnBack').onclick=()=>{if(confirm('ย้อนกลับ? (ข้อมูลถูกบันทึกแล้ว)'))window.history.back()};

/* INIT */
orders=load();
renderItems();setMode(false);renderTable();
</script>
</body>
</html>
