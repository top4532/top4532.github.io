<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW MODEL | ระบบจัดการโมเดลสินค้า</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body{ background:linear-gradient(135deg,#eaf4ff,#f8fbff); min-height:100vh; padding:30px; }
.container{ max-width:1700px; margin:auto; }
.page-header{ background:#fff; border-radius:24px; padding:30px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; box-shadow:0 10px 35px rgba(37,99,235,.12); border:1px solid #dbeafe; margin-bottom:25px; }
.header-left{ display:flex; align-items:center; gap:20px; }
.logo-box{ width:80px; height:80px; border-radius:20px; background:linear-gradient(135deg,#3b82f6,#2563eb); display:flex; align-items:center; justify-content:center; color:#fff; font-size:35px; box-shadow:0 10px 25px rgba(37,99,235,.3); }
.header-text h1{ color:#0f172a; font-size:34px; font-weight:700; }
.header-text p{ color:#64748b; margin-top:6px; }
.header-actions{ display:flex; gap:15px; align-items:center; }
.back-btn, .show-data-btn{ border:none; padding:14px 25px; border-radius:14px; cursor:pointer; font-weight:600; transition:.3s; font-size:15px; }
.back-btn{ background:linear-gradient(135deg,#3b82f6,#2563eb); color:white; }
.show-data-btn{ background:linear-gradient(135deg,#10b981,#059669); color:white; box-shadow:0 4px 10px rgba(16,185,129,0.2); }
.back-btn:hover, .show-data-btn:hover{ transform:translateY(-2px); filter:brightness(1.02); }
.table-card{ background:#fff; border-radius:24px; padding:25px; border:1px solid #dbeafe; box-shadow:0 10px 35px rgba(37,99,235,.08); margin-bottom:20px; }
.card-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
.card-header h2{ color:#0f172a; font-size:24px; }
.add-btn{ border:none; background:linear-gradient(135deg,#3b82f6,#2563eb); color:white; padding:12px 20px; border-radius:12px; cursor:pointer; font-weight:600; transition:0.2s; }
.add-btn:hover{ transform:scale(0.97); background:#2563eb; }
.table-responsive{ overflow-x:auto; }
table{ width:100%; min-width:1600px; border-collapse:collapse; }
thead{ background:linear-gradient(90deg,#3b82f6,#2563eb); }
thead th{ color:white; padding:16px; text-align:left; font-size:14px; font-weight:600; }
thead th i{ margin-right:6px; }
tbody tr:hover{ background:#f8fbff; }
tbody td{ padding:10px; border-bottom:1px solid #e2e8f0; vertical-align:middle; }
input, select{ width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px; outline:none; background:#f8fbff; transition:0.2s; }
input:focus, select:focus{ border-color:#3b82f6; box-shadow:0 0 0 4px rgba(59,130,246,.15); }
.delete-btn{ width:42px; height:42px; border:none; border-radius:10px; background:#ef4444; color:white; cursor:pointer; transition:0.2s; }
.delete-btn:hover{ background:#dc2626; transform:scale(0.95); }
.save-area{ margin-top:25px; text-align:right; }
.save-btn{ border:none; background:linear-gradient(135deg,#3b82f6,#2563eb); color:white; padding:15px 30px; border-radius:14px; cursor:pointer; font-size:15px; font-weight:600; transition:0.2s; }
.save-btn:hover{ transform:translateY(-2px); }
.toast-msg{ position:fixed; bottom:30px; right:30px; background:#0f172a; color:white; padding:12px 24px; border-radius:40px; font-weight:500; z-index:1000; box-shadow:0 8px 20px rgba(0,0,0,0.1); opacity:0; transition:opacity 0.3s ease; pointer-events:none; }
.toast-msg.show{ opacity:1; }
@media(max-width:768px){ .page-header{ flex-direction:column; align-items:flex-start; } .header-actions{ width:100%; justify-content:flex-start; } .card-header{ flex-direction:column; align-items:stretch; } .add-btn{ width:fit-content; } }
</style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <div class="header-left">
            <div class="logo-box"><i class="fa-solid fa-cubes-stacked"></i></div>
            <div class="header-text">
                <h1><i class="fa-solid fa-cube"></i> NEW MODEL</h1>
                <p>ระบบจัดการโมเดลสินค้าใหม่ และติดตามสถานะการพัฒนา</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="show-data-btn" id="showDataBtn"><i class="fa-solid fa-chart-simple"></i> แสดงข้อมูล NEW MODEL</button>
            <button class="back-btn" id="backHomeBtn"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</button>
        </div>
    </div>
    <div class="table-card">
        <div class="card-header">
            <h2><i class="fa-solid fa-table"></i> รายการสินค้า</h2>
            <button class="add-btn" id="addRowBtn"><i class="fa-solid fa-plus"></i> เพิ่มรายการ</button>
        </div>
        <div class="table-responsive">
            <table id="productTable">
                <thead><tr><th><i class="fa-solid fa-box"></i> รหัสสินค้า</th><th><i class="fa-solid fa-barcode"></i> บาร์โค้ด</th><th><i class="fa-solid fa-file-lines"></i> รายละเอียดสินค้า</th><th><i class="fa-solid fa-tags"></i> ยี่ห้อ</th><th><i class="fa-solid fa-baht-sign"></i> ราคา</th><th><i class="fa-solid fa-cubes"></i> จำนวน</th><th><i class="fa-solid fa-layer-group"></i> MOQ</th><th><i class="fa-solid fa-truck"></i> ซัพพลายเออร์</th><th><i class="fa-solid fa-chart-line"></i> สถานะ</th><th><i class="fa-solid fa-gear"></i> จัดการ</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="save-area"><button class="save-btn" id="saveDataBtn"><i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล</button></div>
    </div>
</div>
<div id="toastMsg" class="toast-msg">✅ บันทึกข้อมูลเรียบร้อย</div>
<script>
    const STORAGE_KEY = "new_model_products";
    let currentProducts = [];
    const STATUS_OPTIONS = ["เสร็จสมบูรณ์", "อยู่ในขั้นตอนผลิต", "ขั้นตอนวาด Drawing"];

    function createEmptyProduct() {
        return { sku:"", barcode:"", description:"", brand:"", price:"", quantity:"", moq:"", supplier:"", status:"เสร็จสมบูรณ์" };
    }
    function loadProductsFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            try{
                currentProducts = JSON.parse(stored);
                currentProducts = currentProducts.map(p => ({ ...createEmptyProduct(), ...p, status: STATUS_OPTIONS.includes(p.status)?p.status:"เสร็จสมบูรณ์" }));
            }catch(e){ currentProducts = []; }
        }
        if(!currentProducts.length) currentProducts = [createEmptyProduct()];
    }
    function renderTable() {
        const tbody = document.getElementById("tableBody");
        if(!tbody) return;
        tbody.innerHTML = "";
        currentProducts.forEach((product, idx) => {
            const row = tbody.insertRow();
            const addInput = (value, type, placeholder, onInput) => { let inp = document.createElement("input"); inp.type=type; inp.placeholder=placeholder; inp.value=value; inp.addEventListener("input", onInput); return inp; };
            const skuCell = row.insertCell(0); let skuInp = addInput(product.sku,"text","SKU001",e=>currentProducts[idx].sku=e.target.value); skuCell.appendChild(skuInp);
            const barcodeCell = row.insertCell(1); let bcInp = addInput(product.barcode,"text","885xxxxxxxxxxxx",e=>currentProducts[idx].barcode=e.target.value); barcodeCell.appendChild(bcInp);
            const descCell = row.insertCell(2); let descInp = addInput(product.description,"text","รายละเอียดสินค้า",e=>currentProducts[idx].description=e.target.value); descCell.appendChild(descInp);
            const brandCell = row.insertCell(3); let brandInp = addInput(product.brand,"text","Brand",e=>currentProducts[idx].brand=e.target.value); brandCell.appendChild(brandInp);
            const priceCell = row.insertCell(4); let priceInp = addInput(product.price,"number","0.00",e=>currentProducts[idx].price=e.target.value); priceInp.step="0.01"; priceCell.appendChild(priceInp);
            const qtyCell = row.insertCell(5); let qtyInp = addInput(product.quantity,"number","0",e=>currentProducts[idx].quantity=e.target.value); qtyCell.appendChild(qtyInp);
            const moqCell = row.insertCell(6); let moqInp = addInput(product.moq,"number","100",e=>currentProducts[idx].moq=e.target.value); moqCell.appendChild(moqInp);
            const supCell = row.insertCell(7); let supInp = addInput(product.supplier,"text","Supplier",e=>currentProducts[idx].supplier=e.target.value); supCell.appendChild(supInp);
            const statusCell = row.insertCell(8); let sel = document.createElement("select"); STATUS_OPTIONS.forEach(opt=>{ let op=document.createElement("option"); op.value=opt; op.textContent=opt; if(product.status===opt) op.selected=true; sel.appendChild(op); }); sel.addEventListener("change",e=>currentProducts[idx].status=e.target.value); statusCell.appendChild(sel);
            const actionCell = row.insertCell(9); let delBtn = document.createElement("button"); delBtn.className="delete-btn"; delBtn.innerHTML='<i class="fa-solid fa-trash"></i>'; delBtn.onclick=()=>{ if(currentProducts.length===1){ showToast("⚠️ ต้องมีอย่างน้อย 1 รายการ","warning"); return; } currentProducts.splice(idx,1); renderTable(); showToast("🗑️ ลบรายการแล้ว","info"); }; actionCell.appendChild(delBtn);
        });
    }
    function showToast(msg, type="success"){ let toast=document.getElementById("toastMsg"); if(!toast){ let d=document.createElement("div"); d.id="toastMsg"; d.className="toast-msg"; document.body.appendChild(d); toast=d; } if(type==="warning"){ toast.style.backgroundColor="#eab308"; toast.style.color="#1e293b"; }else if(type==="error"){ toast.style.backgroundColor="#ef4444"; }else{ toast.style.backgroundColor="#0f172a"; toast.style.color="white"; } toast.textContent=msg; toast.classList.add("show"); setTimeout(()=>{ toast.classList.remove("show"); setTimeout(()=>{ toast.style.backgroundColor="#0f172a"; toast.style.color="white"; },300); },2000); }
    function saveToLocalStorage(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(currentProducts)); showToast("💾 บันทึกข้อมูลสำเร็จ!","success"); }
    function addNewRow(){ currentProducts.push(createEmptyProduct()); renderTable(); showToast("➕ เพิ่มรายการใหม่","info"); document.querySelector(".table-responsive")?.scrollTo({top:document.querySelector(".table-responsive").scrollHeight, behavior:"smooth"}); }
    function goToNew1Page(){ saveToLocalStorage(); window.open("NEW1.html", "_blank"); }
    function goBackHome(){ if(document.referrer && document.referrer!=="") history.back(); else window.location.href="/"; }
    loadProductsFromStorage();
    renderTable();
    document.getElementById("addRowBtn")?.addEventListener("click", addNewRow);
    document.getElementById("saveDataBtn")?.addEventListener("click", saveToLocalStorage);
    document.getElementById("showDataBtn")?.addEventListener("click", goToNew1Page);
    document.getElementById("backHomeBtn")?.addEventListener("click", goBackHome);
    window.addEventListener("beforeunload", ()=>localStorage.setItem(STORAGE_KEY, JSON.stringify(currentProducts)));
</script>
</body>
</html>
