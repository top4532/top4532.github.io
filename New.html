<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW MODEL - แสดงข้อมูลทั้งหมด</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body{ background:linear-gradient(135deg,#eaf4ff,#f8fbff); padding:30px; }
    .data-container{ max-width:1600px; margin:auto; background:white; border-radius:28px; padding:25px; box-shadow:0 20px 35px rgba(0,0,0,0.05); }
    h1{ font-size:28px; margin-bottom:8px; color:#0f172a; }
    .header-icon{ background:#3b82f6; width:50px; height:50px; border-radius:18px; display:inline-flex; align-items:center; justify-content:center; color:white; margin-right:15px; }
    .title-flex{ display:flex; align-items:center; margin-bottom:20px; border-bottom:2px solid #e2e8f0; padding-bottom:15px; }
    table{ width:100%; border-collapse:collapse; margin-top:20px; }
    th{ background:#2563eb; color:white; padding:12px; text-align:left; }
    td{ padding:10px; border-bottom:1px solid #cbd5e1; }
    tr:hover{ background:#f1f5f9; }
    .status-badge{ background:#e0f2fe; padding:6px 12px; border-radius:40px; font-size:13px; color:#0369a1; font-weight:500; display:inline-block; }
    .back-btn{ background:#3b82f6; border:none; padding:10px 20px; border-radius:14px; color:white; font-weight:bold; cursor:pointer; margin-top:20px; transition:0.2s; }
    .back-btn:hover{ background:#2563eb; transform:translateY(-2px); }
    .count-info{ background:#f1f5f9; padding:8px 16px; border-radius:30px; font-size:14px; margin-bottom:15px; display:inline-block; }
    .empty-msg{ text-align:center; padding:40px; color:#64748b; font-size:18px; }
</style>
</head>
<body>
<div class="data-container">
    <div class="title-flex">
        <div class="header-icon"><i class="fa-solid fa-cubes"></i></div>
        <div><h1><i class="fa-solid fa-database"></i> ข้อมูล NEW MODEL ทั้งหมด</h1><p>ระบบแสดงโมเดลสินค้าที่บันทึกไว้ (จาก localStorage)</p></div>
    </div>
    <div id="infoArea"></div>
    <div style="overflow-x:auto;">
        <table id="displayTable">
            <thead>
                <tr><th>รหัสสินค้า</th><th>บาร์โค้ด</th><th>รายละเอียด</th><th>ยี่ห้อ</th><th>ราคา (บาท)</th><th>จำนวน</th><th>MOQ</th><th>ซัพพลายเออร์</th><th>สถานะ</th></tr>
            </thead>
            <tbody id="tableBodyData"></tbody>
        </table>
    </div>
    <div style="margin-top:25px; text-align:center;">
        <button class="back-btn" onclick="window.close()"><i class="fa-solid fa-times"></i> ปิดหน้านี้</button>
    </div>
</div>
<script>
    const STORAGE_KEY = "new_model_products";
    function escapeHtml(str) { if(!str) return "-"; return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function loadAndDisplay() {
        const stored = localStorage.getItem(STORAGE_KEY);
        let products = [];
        if(stored) {
            try{ products = JSON.parse(stored); }catch(e){ products = []; }
        }
        const tbody = document.getElementById("tableBodyData");
        const infoDiv = document.getElementById("infoArea");
        if(!tbody) return;
        tbody.innerHTML = "";
        if(!products || products.length === 0) {
            infoDiv.innerHTML = `<div class="count-info"><i class="fa-regular fa-face-frown"></i> ไม่พบข้อมูล กรุณากลับไปหน้าแรกและบันทึกข้อมูลก่อน</div>`;
            const emptyRow = tbody.insertRow();
            const cell = emptyRow.insertCell(0);
            cell.colSpan = 9;
            cell.className = "empty-msg";
            cell.innerHTML = '<i class="fa-solid fa-database"></i> ยังไม่มีข้อมูลโมเดล กดปุ่มบันทึกในหน้าแรก แล้วเปิดหน้านี้ใหม่';
            return;
        }
        infoDiv.innerHTML = `<div class="count-info"><i class="fa-regular fa-rectangle-list"></i> จำนวนรายการทั้งหมด: ${products.length} รายการ</div>`;
        products.forEach(prod => {
            const row = tbody.insertRow();
            row.insertCell(0).textContent = escapeHtml(prod.sku) || "-";
            row.insertCell(1).textContent = escapeHtml(prod.barcode) || "-";
            row.insertCell(2).textContent = escapeHtml(prod.description) || "-";
            row.insertCell(3).textContent = escapeHtml(prod.brand) || "-";
            const priceVal = (prod.price !== undefined && prod.price !== "") ? parseFloat(prod.price).toFixed(2) : "-";
            row.insertCell(4).textContent = priceVal !== "-" ? priceVal : "-";
            row.insertCell(5).textContent = (prod.quantity !== undefined && prod.quantity !== "") ? prod.quantity : "0";
            row.insertCell(6).textContent = (prod.moq !== undefined && prod.moq !== "") ? prod.moq : "-";
            row.insertCell(7).textContent = escapeHtml(prod.supplier) || "-";
            const statusSpan = document.createElement("span");
            statusSpan.className = "status-badge";
            statusSpan.textContent = escapeHtml(prod.status) || "เสร็จสมบูรณ์";
            const statusCell = row.insertCell(8);
            statusCell.appendChild(statusSpan);
        });
    }
    loadAndDisplay();
    // ถ้าต้องการโหลดใหม่เมื่อ focus (optional)
    window.addEventListener("focus", loadAndDisplay);
</script>
</body>
</html>
