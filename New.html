<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW MODEL</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f1f5f9;
    min-height:100vh;
    padding:30px;
}

.page-container{
    max-width:1400px;
    margin:auto;
}

/* Header */

.page-header{
    background:#ffffff;
    border-radius:20px;
    padding:30px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 25px rgba(0,0,0,0.08);
}

.header-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.header-icon{
    width:70px;
    height:70px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:30px;
}

.header-text h1{
    font-size:32px;
    color:#0f172a;
    margin-bottom:5px;
}

.header-text p{
    color:#64748b;
    font-size:15px;
}

.header-right button{
    border:none;
    background:#2563eb;
    color:white;
    padding:14px 24px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.header-right button:hover{
    background:#1d4ed8;
}

@media(max-width:768px){

    .page-header{
        flex-direction:column;
        gap:20px;
        align-items:flex-start;
    }

    .header-left{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>
</head>
<body>

<div class="page-container">

    <div class="page-header">

        <div class="header-left">

            <div class="header-icon">
                <i class="fa-solid fa-cube"></i>
            </div>

            <div class="header-text">
                <h1>NEW MODEL</h1>
                <p>Create and manage new product models in the system.</p>
            </div>

        </div>

        <div class="header-right">
            <button>
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </button>
        </div>

    </div>

</div>

</body>
</html>
