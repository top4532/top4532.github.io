<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW MODEL</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f1f5f9;
    min-height:100vh;
    padding:30px;
}

.page-container{
    max-width:1600px;
    margin:auto;
}

/* Header */

.page-header{
    background:#ffffff;
    border-radius:20px;
    padding:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.header-icon{
    width:70px;
    height:70px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
}

.header-text h1{
    font-size:32px;
    color:#0f172a;
}

.header-text p{
    color:#64748b;
    margin-top:5px;
}

.header-right button{
    border:none;
    background:#2563eb;
    color:#fff;
    padding:14px 25px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.header-right button:hover{
    background:#1d4ed8;
}

/* Table */

.table-card{
    background:#fff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.table-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.table-title h2{
    color:#0f172a;
}

.add-btn{
    background:#16a34a;
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.add-btn:hover{
    background:#15803d;
}

.table-responsive{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1400px;
}

thead{
    background:#2563eb;
}

thead th{
    color:#fff;
    padding:15px;
    text-align:left;
    font-size:14px;
}

tbody td{
    padding:10px;
    border-bottom:1px solid #e2e8f0;
}

input,
select{
    width:100%;
    padding:10px 12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#2563eb;
}

.status-complete{
    color:#16a34a;
    font-weight:600;
}

.status-process{
    color:#f59e0b;
    font-weight:600;
}

.status-drawing{
    color:#2563eb;
    font-weight:600;
}

.action-btn{
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    color:white;
}

.delete-btn{
    background:#dc2626;
}

.save-section{
    margin-top:25px;
    text-align:right;
}

.save-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.save-btn:hover{
    background:#1d4ed8;
}

@media(max-width:768px){

    .page-header{
        flex-direction:column;
        gap:20px;
        align-items:flex-start;
    }

}

</style>
</head>
<body>

<div class="page-container">

    <!-- Header -->

    <div class="page-header">

        <div class="header-left">

            <div class="header-icon">
                <i class="fa-solid fa-cube"></i>
            </div>

            <div class="header-text">
                <h1>NEW MODEL</h1>
                <p>ระบบจัดการข้อมูลสินค้าและโมเดลใหม่</p>
            </div>

        </div>

        <div class="header-right">
            <button>
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </button>
        </div>

    </div>

    <!-- Table -->

    <div class="table-card">

        <div class="table-title">
            <h2>รายการสินค้า</h2>

            <button class="add-btn">
                <i class="fa-solid fa-plus"></i>
                เพิ่มรายการ
            </button>
        </div>

        <div class="table-responsive">

            <table>

                <thead>
                    <tr>
                        <th>รหัสสินค้า</th>
                        <th>บาร์โค้ด</th>
                        <th>รายละเอียดสินค้า</th>
                        <th>ยี่ห้อ</th>
                        <th>ราคา</th>
                        <th>จำนวน</th>
                        <th>MOQ</th>
                        <th>ซัพพลายเออร์</th>
                        <th>สถานะ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td><input type="text" placeholder="SKU001"></td>

                        <td><input type="text" placeholder="885xxxxxxxx"></td>

                        <td><input type="text" placeholder="รายละเอียดสินค้า"></td>

                        <td><input type="text" placeholder="CJL"></td>

                        <td><input type="number" placeholder="0.00"></td>

                        <td><input type="number" placeholder="0"></td>

                        <td><input type="number" placeholder="100"></td>

                        <td><input type="text" placeholder="Supplier"></td>

                        <td>
                            <select>
                                <option>เสร็จสมบูรณ์</option>
                                <option>อยู่ในขั้นตอนผลิต</option>
                                <option>ขั้นตอนวาด Drawing</option>
                            </select>
                        </td>

                        <td>
                            <button class="action-btn delete-btn">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <div class="save-section">
            <button class="save-btn">
                <i class="fa-solid fa-floppy-disk"></i>
                บันทึกข้อมูล
            </button>
        </div>

    </div>

</div>

</body>
</html>
