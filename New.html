<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW MODEL | จัดการสินค้า</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, sans-serif;
}
body {
    background: linear-gradient(135deg, #e6f0ff, #f0f7ff);
    padding: 30px;
}
.container {
    max-width: 1500px;
    margin: auto;
}
/* header */
.page-header {
    background: white;
    border-radius: 32px;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}
.header-left {
    display: flex;
    align-items: center;
    gap: 18px;
}
.logo-small {
    width: 55px;
    height: 55px;
    background: linear-gradient(135deg,#2b7be4,#1a5fc9);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 28px;
}
.header-text h2 {
    color: #0a2b4e;
}
.btn-back {
    background: #eef4ff;
    border: none;
    padding: 10px 20px;
    border-radius: 40px;
    cursor: pointer;
    font-weight: 600;
    color: #1e4a8a;
}
/* ตาราง */
.table-card {
    background: white;
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}
.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.add-btn {
    background: #1e6fdf;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 40px;
    cursor: pointer;
    font-weight: 600;
}
.table-responsive {
    overflow-x: auto;
}
table {
    width: 100%;
    min-width: 1200px;
    border-collapse: collapse;
}
thead {
    background: #eef4ff;
}
th {
    padding: 14px 12px;
    text-align: left;
    color: #1e3a6b;
}
td {
    padding: 12px;
    border-bottom: 1px solid #e2edf5;
    color: #1e2f45;
}
.action-buttons {
    display: flex;
    gap: 8px;
}
.edit-btn, .delete-btn {
    background: none;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1rem;
}
.edit-btn:hover { background: #e2edff; color: #1e6fdf; }
.delete-btn:hover { background: #ffe6e5; color: #dc2626; }

/* Modal (เหมือนเดิม) */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,20,50,0.5);
    backdrop-filter: blur(3px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-content {
    background: white;
    max-width: 700px;
    width: 90%;
    border-radius: 36px;
    padding: 28px;
    border: 1px solid #bfd9ff;
}
.modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 20px;
}
.modal-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.modal-field label {
    font-weight: 600;
    color: #1e4a76;
}
.modal-field input, .modal-field select {
    padding: 10px 14px;
    border-radius: 24px;
    border: 1px solid #cbdff1;
}
.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 15px;
}
.cancel-btn {
    background: #edf3fc;
    padding: 10px 24px;
    border-radius: 40px;
    border: none;
}
.submit-btn {
    background: #1e6fdf;
    color: white;
    padding: 10px 24px;
    border-radius: 40px;
    border: none;
}
.toast-msg {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #0a2b4e;
    color: white;
    padding: 12px 24px;
    border-radius: 50px;
    opacity: 0;
    transition: 0.25s;
    pointer-events: none;
    z-index: 1100;
}
.toast-msg.show { opacity: 1; }
@media (max-width: 700px) {
    .modal-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <div class="header-left">
            <div class="logo-small"><i class="fa-solid fa-table-list"></i></div>
            <div class="header-text"><h2><i class="fa-solid fa-cubes"></i> จัดการข้อมูล NEW MODEL</h2><p>ตารางสินค้า - เพิ่ม/แก้ไข/ลบ</p></div>
        </div>
        <button class="btn-back" id="backToHomeBtn"><i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก</button>
    </div>
    <div class="table-card">
        <div class="card-header">
            <h3>รายการสินค้าทั้งหมด</h3>
            <button class="add-btn" id="openAddModalBtn"><i class="fa-solid fa-plus"></i> เพิ่มสินค้า</button>
        </div>
        <div class="table-responsive">
            <table id="productTable">
                <thead><tr><th>รหัสสินค้า</th><th>บาร์โค้ด</th><th>รายละเอียด</th><th>ยี่ห้อ</th><th>ราคา</th><th>จำนวน</th><th>MOQ</th><th>ซัพพลายเออร์</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal CRUD -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">เพิ่มสินค้าใหม่</h3>
        <div class="modal-grid">
            <div class="modal-field"><label>รหัสสินค้า</label><input type="text" id="modalSku" placeholder="SKU001"></div>
            <div class="modal-field"><label>บาร์โค้ด</label><input type="text" id="modalBarcode" placeholder="885xxxxxxxxxxxx"></div>
            <div class="modal-field"><label>รายละเอียด</label><input type="text" id="modalDesc" placeholder="รายละเอียด"></div>
            <div class="modal-field"><label>ยี่ห้อ</label><input type="text" id="modalBrand" placeholder="Brand"></div>
            <div class="modal-field"><label>ราคา</label><input type="number" id="modalPrice" step="0.01" placeholder="0.00"></div>
            <div class="modal-field"><label>จำนวน</label><input type="number" id="modalQty" placeholder="0"></div>
            <div class="modal-field"><label>MOQ</label><input type="number" id="modalMoq" placeholder="100"></div>
            <div class="modal-field"><label>ซัพพลายเออร์</label><input type="text" id="modalSupplier" placeholder="Supplier"></div>
            <div class="modal-field"><label>สถานะ</label>
                <select id="modalStatus"><option>เสร็จสมบูรณ์</option><option>อยู่ในขั้นตอนผลิต</option><option>ขั้นตอนวาด Drawing</option></select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="cancel-btn" id="closeModalBtn">ยกเลิก</button>
            <button class="submit-btn" id="submitBtn">บันทึก</button>
        </div>
    </div>
</div>
<div id="toastMsg" class="toast-msg"></div>

<script>
    const STORAGE_KEY = "new_model_products";
    let currentProducts = [];
    let editIndex = null; // null = เพิ่มใหม่, not null = แก้ไข

    function loadProducts() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            try { currentProducts = JSON.parse(stored); } catch(e) { currentProducts = []; }
        } else { currentProducts = []; }
    }
    function saveProducts() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentProducts));
    }
    function renderTable() {
        const tbody = document.getElementById("tableBody");
        if(!tbody) return;
        tbody.innerHTML = "";
        if(currentProducts.length === 0) {
            const row = tbody.insertRow();
            row.insertCell(0).colSpan = 10;
            row.insertCell(0).textContent = "ไม่มีข้อมูลสินค้า คลิก 'เพิ่มสินค้า' เพื่อเริ่มต้น";
            row.cells[0].style.padding = "40px";
            row.cells[0].style.textAlign = "center";
            return;
        }
        currentProducts.forEach((prod, idx) => {
            const row = tbody.insertRow();
            row.insertCell(0).textContent = prod.sku || "-";
            row.insertCell(1).textContent = prod.barcode || "-";
            row.insertCell(2).textContent = prod.description || "-";
            row.insertCell(3).textContent = prod.brand || "-";
            let priceShow = (prod.price !== "" && prod.price !== undefined) ? `฿ ${parseFloat(prod.price).toFixed(2)}` : "-";
            row.insertCell(4).textContent = priceShow;
            row.insertCell(5).textContent = prod.quantity !== "" ? prod.quantity : "0";
            row.insertCell(6).textContent = prod.moq !== "" ? prod.moq : "-";
            row.insertCell(7).textContent = prod.supplier || "-";
            row.insertCell(8).textContent = prod.status;
            const actionCell = row.insertCell(9);
            actionCell.className = "action-buttons";
            const editBtn = document.createElement("button");
            editBtn.className = "edit-btn";
            editBtn.innerHTML = '<i class="fa-regular fa-pen-to-square"></i>';
            editBtn.onclick = () => openEditModal(idx);
            const delBtn = document.createElement("button");
            delBtn.className = "delete-btn";
            delBtn.innerHTML = '<i class="fa-regular fa-trash-can"></i>';
            delBtn.onclick = () => { deleteProduct(idx); };
            actionCell.appendChild(editBtn);
            actionCell.appendChild(delBtn);
        });
    }
    function deleteProduct(idx) {
        if(confirm("ยืนยันการลบรายการนี้?")) {
            currentProducts.splice(idx, 1);
            saveProducts();
            renderTable();
            showToast("🗑️ ลบรายการสำเร็จ");
        }
    }
    function openAddModal() {
        editIndex = null;
        document.getElementById("modalTitle").innerText = "เพิ่มสินค้าใหม่";
        clearModalFields();
        document.getElementById("productModal").style.display = "flex";
    }
    function openEditModal(idx) {
        editIndex = idx;
        const prod = currentProducts[idx];
        document.getElementById("modalTitle").innerText = "แก้ไขสินค้า";
        document.getElementById("modalSku").value = prod.sku || "";
        document.getElementById("modalBarcode").value = prod.barcode || "";
        document.getElementById("modalDesc").value = prod.description || "";
        document.getElementById("modalBrand").value = prod.brand || "";
        document.getElementById("modalPrice").value = prod.price || "";
        document.getElementById("modalQty").value = prod.quantity || "";
        document.getElementById("modalMoq").value = prod.moq || "";
        document.getElementById("modalSupplier").value = prod.supplier || "";
        document.getElementById("modalStatus").value = prod.status || "เสร็จสมบูรณ์";
        document.getElementById("productModal").style.display = "flex";
    }
    function clearModalFields() {
        document.getElementById("modalSku").value = "";
        document.getElementById("modalBarcode").value = "";
        document.getElementById("modalDesc").value = "";
        document.getElementById("modalBrand").value = "";
        document.getElementById("modalPrice").value = "";
        document.getElementById("modalQty").value = "";
        document.getElementById("modalMoq").value = "";
        document.getElementById("modalSupplier").value = "";
        document.getElementById("modalStatus").value = "เสร็จสมบูรณ์";
    }
    function saveFromModal() {
        const newProduct = {
            sku: document.getElementById("modalSku").value.trim(),
            barcode: document.getElementById("modalBarcode").value.trim(),
            description: document.getElementById("modalDesc").value.trim(),
            brand: document.getElementById("modalBrand").value.trim(),
            price: document.getElementById("modalPrice").value,
            quantity: document.getElementById("modalQty").value,
            moq: document.getElementById("modalMoq").value,
            supplier: document.getElementById("modalSupplier").value.trim(),
            status: document.getElementById("modalStatus").value
        };
        if(!newProduct.sku) {
            showToast("⚠️ กรุณากรอกรหัสสินค้า", "warning");
            return;
        }
        if(editIndex !== null) {
            currentProducts[editIndex] = newProduct;
            showToast("✏️ อัปเดตเรียบร้อย");
        } else {
            currentProducts.push(newProduct);
            showToast("➕ เพิ่มสินค้าใหม่");
        }
        saveProducts();
        renderTable();
        closeModal();
    }
    function closeModal() {
        document.getElementById("productModal").style.display = "none";
        editIndex = null;
    }
    function showToast(msg, type="success") {
        let toast = document.getElementById("toastMsg");
        if(type==="warning") toast.style.backgroundColor = "#eab308";
        else toast.style.backgroundColor = "#0a2b4e";
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
    }
    function goBackHome() {
        window.location.href = "index.html"; // หรือชื่อไฟล์หน้าแรกของคุณ
    }

    loadProducts();
    renderTable();

    document.getElementById("openAddModalBtn").addEventListener("click", openAddModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("submitBtn").addEventListener("click", saveFromModal);
    document.getElementById("backToHomeBtn").addEventListener("click", goBackHome);
    window.onclick = function(e) {
        if(e.target === document.getElementById("productModal")) closeModal();
    }
</script>
</body>
</html>
