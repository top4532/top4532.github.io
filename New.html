<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW MODEL | จัดการสินค้า</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#1e6fdf',
                    primaryDark: '#0f5bc2',
                    navy: '#0a2b4e',
                }
            }
        }
    }
</script>
<style>
    body {
        background: linear-gradient(135deg, #e6f0ff, #f0f7ff);
    }
    .modal-animation {
        animation: fadeInUp 0.25s ease;
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body class="min-h-screen p-5 md:p-8">

<div class="max-w-[1500px] mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-3xl p-5 md:p-6 flex flex-wrap justify-between items-center gap-4 shadow-md border border-blue-100 mb-6">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-700 rounded-xl flex items-center justify-center text-white text-xl">
                <i class="fa-solid fa-table-list"></i>
            </div>
            <div>
                <h2 class="text-xl md:text-2xl font-bold text-navy">
                    <i class="fa-solid fa-cubes text-primary mr-2"></i>
                    จัดการข้อมูล NEW MODEL
                </h2>
                <p class="text-gray-500 text-sm">ตารางสินค้า - เพิ่ม/แก้ไข/ลบ</p>
            </div>
        </div>
       <button id="backToHomeBtn"
        onclick="window.location.href='nut.html';"
        class="bg-gray-100 hover:bg-gray-200 text-navy font-semibold px-5 py-2 rounded-full transition flex items-center gap-2">
    <i class="fa-solid fa-arrow-left"></i>
    กลับหน้าแรก
</button>
    </div>
    
    <!-- Table Card -->
    <div class="bg-white rounded-3xl p-5 md:p-6 shadow-md border border-blue-100">
        <div class="flex flex-wrap justify-between items-center mb-5 gap-3">
            <h3 class="text-lg font-bold text-navy">รายการสินค้าทั้งหมด</h3>
            <button id="openAddModalBtn" class="bg-primary hover:bg-primaryDark text-white font-semibold px-5 py-2.5 rounded-full transition shadow-md flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> เพิ่มสินค้า
            </button>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full min-w-[1000px] border-collapse">
                <thead class="bg-blue-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-navy font-semibold">รหัสสินค้า</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">บาร์โค้ด</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">รายละเอียด</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">ยี่ห้อ</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">ราคา</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">จำนวน</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">MOQ</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">ซัพพลายเออร์</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">สถานะ</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Popup สำหรับเพิ่ม/แก้ไข -->
<div id="productModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 md:p-8 border border-blue-100 modal-animation">
        <h3 id="modalTitle" class="text-2xl font-bold text-navy mb-6 flex items-center gap-2 border-l-4 border-primary pl-4">
            <i class="fa-solid fa-pen-to-square text-primary"></i>
            เพิ่มสินค้าใหม่
        </h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
            <div>
                <label class="block font-semibold text-gray-700 text-sm mb-1">📦 รหัสสินค้า *</label>
                <input type="text" id="modalSku" placeholder="SKU001" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 text-sm mb-1">📱 บาร์โค้ด</label>
                <input type="text" id="modalBarcode" placeholder="885xxxxxxxxxxxx" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 text-sm mb-1">📝 รายละเอียดสินค้า</label>
                <input type="text" id="modalDesc" placeholder="ชื่อสินค้า / รายละเอียด" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 text-sm mb-1">🏷️ ยี่ห้อ</label>
                <input type="text" id="modalBrand" placeholder="Brand" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 text-sm mb-1">💰 ราคา (บาท)</label>
                <input type="number" id="modalPrice" step="0.01" placeholder="0.00" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 text-sm mb-1">📊 จำนวน</label>
                <input type="number" id="modalQty" placeholder="0" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 text-sm mb-1">🎯 MOQ</label>
                <input type="number" id="modalMoq" placeholder="100" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 text-sm mb-1">🚚 ซัพพลายเออร์</label>
                <input type="text" id="modalSupplier" placeholder="Supplier" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            <div class="md:col-span-2">
                <label class="block font-semibold text-gray-700 text-sm mb-1">⚙️ สถานะ</label>
                <select id="modalStatus" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition bg-white">
                    <option>เสร็จสมบูรณ์</option>
                    <option>อยู่ในขั้นตอนผลิต</option>
                    <option>ขั้นตอนวาด Drawing</option>
                </select>
            </div>
        </div>
        
        <div class="flex justify-end gap-3 mt-4">
            <button id="closeModalBtn" class="px-6 py-2.5 rounded-full bg-gray-100 text-gray-700 font-semibold hover:bg-gray-200 transition">
                <i class="fa-regular fa-circle-xmark"></i> ยกเลิก
            </button>
            <button id="submitBtn" class="px-6 py-2.5 rounded-full bg-primary text-white font-semibold hover:bg-primaryDark transition shadow-md">
                <i class="fa-regular fa-floppy-disk"></i> บันทึก
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toastMsg" class="fixed bottom-5 right-5 bg-navy text-white px-5 py-3 rounded-full shadow-lg opacity-0 transition-opacity duration-300 z-50 pointer-events-none">
    ✅ ดำเนินการสำเร็จ
</div>

<script>
    const STORAGE_KEY = "new_model_products";
    let currentProducts = [];
    let editIndex = null;

    function loadProducts() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            try { currentProducts = JSON.parse(stored); } catch(e) { currentProducts = []; }
        } else { currentProducts = []; }
    }
    
    function saveProducts() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentProducts));
    }
    
    function showToast(msg, type = "success") {
        const toast = document.getElementById("toastMsg");
        if(type === "warning") {
            toast.classList.remove("bg-navy");
            toast.classList.add("bg-amber-500");
        } else {
            toast.classList.remove("bg-amber-500");
            toast.classList.add("bg-navy");
        }
        toast.textContent = msg;
        toast.classList.remove("opacity-0");
        toast.classList.add("opacity-100");
        setTimeout(() => {
            toast.classList.remove("opacity-100");
            toast.classList.add("opacity-0");
        }, 2200);
    }
    
    function renderTable() {
        const tbody = document.getElementById("tableBody");
        if(!tbody) return;
        tbody.innerHTML = "";
        
        if(currentProducts.length === 0) {
            const row = tbody.insertRow();
            const cell = row.insertCell(0);
            cell.colSpan = 10;
            cell.textContent = "ไม่มีข้อมูลสินค้า คลิก 'เพิ่มสินค้า' เพื่อเริ่มต้น";
            cell.className = "text-center py-10 text-gray-400";
            return;
        }
        
        currentProducts.forEach((prod, idx) => {
            const row = tbody.insertRow();
            row.className = "border-b border-gray-100 hover:bg-blue-50/50 transition";
            
            row.insertCell(0).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.sku) || "-"}</div>`;
            row.insertCell(1).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.barcode) || "-"}</div>`;
            row.insertCell(2).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.description) || "-"}</div>`;
            row.insertCell(3).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.brand) || "-"}</div>`;
            let priceShow = (prod.price !== "" && prod.price !== undefined) ? `฿ ${parseFloat(prod.price).toFixed(2)}` : "-";
            row.insertCell(4).innerHTML = `<div class="px-4 py-3">${priceShow}</div>`;
            row.insertCell(5).innerHTML = `<div class="px-4 py-3">${prod.quantity !== "" ? prod.quantity : "0"}</div>`;
            row.insertCell(6).innerHTML = `<div class="px-4 py-3">${prod.moq !== "" ? prod.moq : "-"}</div>`;
            row.insertCell(7).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.supplier) || "-"}</div>`;
            row.insertCell(8).innerHTML = `<div class="px-4 py-3"><span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-medium">${escapeHtml(prod.status)}</span></div>`;
            
            const actionCell = row.insertCell(9);
            actionCell.className = "px-4 py-3";
            actionCell.innerHTML = `
                <div class="flex gap-2">
                    <button onclick="openEditModal(${idx})" class="w-8 h-8 rounded-xl hover:bg-blue-100 text-gray-600 hover:text-primary transition"><i class="fa-regular fa-pen-to-square"></i></button>
                    <button onclick="deleteProduct(${idx})" class="w-8 h-8 rounded-xl hover:bg-red-100 text-gray-600 hover:text-red-500 transition"><i class="fa-regular fa-trash-can"></i></button>
                </div>
            `;
        });
    }
    
    function escapeHtml(str) {
        if(!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    
    function deleteProduct(idx) {
        if(confirm("ยืนยันการลบรายการนี้?")) {
            currentProducts.splice(idx, 1);
            saveProducts();
            renderTable();
            showToast("🗑️ ลบรายการสำเร็จ");
        }
    }
    
    function openAddModal() {
        editIndex = null;
        document.getElementById("modalTitle").innerHTML = '<i class="fa-solid fa-plus-circle text-primary"></i> เพิ่มสินค้าใหม่';
        clearModalFields();
        document.getElementById("productModal").classList.remove("hidden");
        document.getElementById("productModal").classList.add("flex");
    }
    
    window.openEditModal = function(idx) {
        editIndex = idx;
        const prod = currentProducts[idx];
        document.getElementById("modalTitle").innerHTML = '<i class="fa-solid fa-pen-to-square text-primary"></i> แก้ไขสินค้า';
        document.getElementById("modalSku").value = prod.sku || "";
        document.getElementById("modalBarcode").value = prod.barcode || "";
        document.getElementById("modalDesc").value = prod.description || "";
        document.getElementById("modalBrand").value = prod.brand || "";
        document.getElementById("modalPrice").value = prod.price || "";
        document.getElementById("modalQty").value = prod.quantity || "";
        document.getElementById("modalMoq").value = prod.moq || "";
        document.getElementById("modalSupplier").value = prod.supplier || "";
        document.getElementById("modalStatus").value = prod.status || "เสร็จสมบูรณ์";
        document.getElementById("productModal").classList.remove("hidden");
        document.getElementById("productModal").classList.add("flex");
    }
    
    function clearModalFields() {
        document.getElementById("modalSku").value = "";
        document.getElementById("modalBarcode").value = "";
        document.getElementById("modalDesc").value = "";
        document.getElementById("modalBrand").value = "";
        document.getElementById("modalPrice").value = "";
        document.getElementById("modalQty").value = "";
        document.getElementById("modalMoq").value = "";
        document.getElementById("modalSupplier").value = "";
        document.getElementById("modalStatus").value = "เสร็จสมบูรณ์";
    }
    
    function saveFromModal() {
        const sku = document.getElementById("modalSku").value.trim();
        if(!sku) {
            showToast("⚠️ กรุณากรอกรหัสสินค้า", "warning");
            return;
        }
        
        const newProduct = {
            sku: sku,
            barcode: document.getElementById("modalBarcode").value.trim(),
            description: document.getElementById("modalDesc").value.trim(),
            brand: document.getElementById("modalBrand").value.trim(),
            price: document.getElementById("modalPrice").value,
            quantity: document.getElementById("modalQty").value,
            moq: document.getElementById("modalMoq").value,
            supplier: document.getElementById("modalSupplier").value.trim(),
            status: document.getElementById("modalStatus").value
        };
        
        if(editIndex !== null) {
            currentProducts[editIndex] = newProduct;
            showToast("✏️ อัปเดตเรียบร้อย");
        } else {
            currentProducts.push(newProduct);
            showToast("➕ เพิ่มสินค้าใหม่");
        }
        saveProducts();
        renderTable();
        closeModal();
    }
    
    function closeModal() {
        document.getElementById("productModal").classList.remove("flex");
        document.getElementById("productModal").classList.add("hidden");
        editIndex = null;
    }
    
    function goBackHome() {
        window.location.href = "nut.html";
    }
    
    loadProducts();
    renderTable();
    
    document.getElementById("openAddModalBtn").addEventListener("click", openAddModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("submitBtn").addEventListener("click", saveFromModal);
    document.getElementById("backToHomeBtn").addEventListener("click", goBackHome);
    
    window.onclick = function(e) {
        const modal = document.getElementById("productModal");
        if(e.target === modal) closeModal();
    }
</script>
</body>
</html>
