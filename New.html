<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW MODEL</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#eaf4ff,#f8fbff);
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1700px;
    margin:auto;
}

/* Header */

.page-header{
    background:#fff;
    border-radius:24px;
    padding:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 10px 35px rgba(37,99,235,.12);
    border:1px solid #dbeafe;
    margin-bottom:25px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo-box{
    width:80px;
    height:80px;
    border-radius:20px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:35px;
    box-shadow:0 10px 25px rgba(37,99,235,.3);
}

.header-text h1{
    color:#0f172a;
    font-size:34px;
    font-weight:700;
}

.header-text p{
    color:#64748b;
    margin-top:6px;
}

.back-btn{
    border:none;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    padding:14px 25px;
    border-radius:14px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.back-btn:hover{
    transform:translateY(-2px);
}

/* Table Card */

.table-card{
    background:#fff;
    border-radius:24px;
    padding:25px;
    border:1px solid #dbeafe;
    box-shadow:0 10px 35px rgba(37,99,235,.08);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.card-header h2{
    color:#0f172a;
    font-size:24px;
}

.add-btn{
    border:none;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
}

.table-responsive{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1600px;
    border-collapse:collapse;
}

thead{
    background:linear-gradient(90deg,#3b82f6,#2563eb);
}

thead th{
    color:white;
    padding:16px;
    text-align:left;
    font-size:14px;
    font-weight:600;
}

thead th i{
    margin-right:6px;
}

tbody tr:hover{
    background:#f8fbff;
}

tbody td{
    padding:10px;
    border-bottom:1px solid #e2e8f0;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    background:#f8fbff;
}

input:focus,
select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 4px rgba(59,130,246,.15);
}

.delete-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:10px;
    background:#ef4444;
    color:white;
    cursor:pointer;
}

.save-area{
    margin-top:25px;
    text-align:right;
}

.save-btn{
    border:none;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    padding:15px 30px;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.save-btn:hover{
    transform:translateY(-2px);
}

@media(max-width:768px){

    .page-header{
        flex-direction:column;
        gap:20px;
        align-items:flex-start;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="page-header">

        <div class="header-left">

            <div class="logo-box">
                <i class="fa-solid fa-cubes-stacked"></i>
            </div>

            <div class="header-text">
                <h1>
                    <i class="fa-solid fa-cube"></i>
                    NEW MODEL
                </h1>
                <p>ระบบจัดการโมเดลสินค้าใหม่ และติดตามสถานะการพัฒนา</p>
            </div>

        </div>

        <button class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            กลับหน้าหลัก
        </button>

    </div>

    <div class="table-card">

        <div class="card-header">

            <h2>
                <i class="fa-solid fa-table"></i>
                รายการสินค้า
            </h2>

            <button class="add-btn">
                <i class="fa-solid fa-plus"></i>
                เพิ่มรายการ
            </button>

        </div>

        <div class="table-responsive">

            <table>

                <thead>
                    <tr>
                        <th><i class="fa-solid fa-box"></i> รหัสสินค้า</th>
                        <th><i class="fa-solid fa-barcode"></i> บาร์โค้ด</th>
                        <th><i class="fa-solid fa-file-lines"></i> รายละเอียดสินค้า</th>
                        <th><i class="fa-solid fa-tags"></i> ยี่ห้อ</th>
                        <th><i class="fa-solid fa-baht-sign"></i> ราคา</th>
                        <th><i class="fa-solid fa-cubes"></i> จำนวน</th>
                        <th><i class="fa-solid fa-layer-group"></i> MOQ</th>
                        <th><i class="fa-solid fa-truck"></i> ซัพพลายเออร์</th>
                        <th><i class="fa-solid fa-chart-line"></i> สถานะ</th>
                        <th><i class="fa-solid fa-gear"></i> จัดการ</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>

                        <td>
                            <input type="text" placeholder="SKU001">
                        </td>

                        <td>
                            <input type="text" placeholder="885xxxxxxxxxxxx">
                        </td>

                        <td>
                            <input type="text" placeholder="รายละเอียดสินค้า">
                        </td>

                        <td>
                            <input type="text" placeholder="Brand">
                        </td>

                        <td>
                            <input type="number" placeholder="0.00">
                        </td>

                        <td>
                            <input type="number" placeholder="0">
                        </td>

                        <td>
                            <input type="number" placeholder="100">
                        </td>

                        <td>
                            <input type="text" placeholder="Supplier">
                        </td>

                        <td>
                            <select>
                                <option>เสร็จสมบูรณ์</option>
                                <option>อยู่ในขั้นตอนผลิต</option>
                                <option>ขั้นตอนวาด Drawing</option>
                            </select>
                        </td>

                        <td>
                            <button class="delete-btn">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <div class="save-area">

            <button class="save-btn">
                <i class="fa-solid fa-floppy-disk"></i>
                บันทึกข้อมูล
            </button>

        </div>

    </div>

</div>

</body>
</html>
