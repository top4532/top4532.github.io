<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
}

.login-box{
    width:350px;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    color:#555;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#2196f3;
}

.btn-login{
    width:100%;
    padding:12px;
    border:none;
    background:#2196f3;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.btn-login:hover{
    background:#1976d2;
}

.footer{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.footer a{
    text-decoration:none;
    color:#2196f3;
}
</style>

</head>
<body>

<div class="login-box">
    <h2>เข้าสู่ระบบ</h2>

    <form>
        <div class="input-group">
            <label>ชื่อผู้ใช้</label>
            <input type="text" placeholder="กรอกชื่อผู้ใช้" required>
        </div>

        <div class="input-group">
            <label>รหัสผ่าน</label>
            <input type="password" placeholder="กรอกรหัสผ่าน" required>
        </div>

        <button type="submit" class="btn-login">
            เข้าสู่ระบบ
        </button>
    </form>

    <div class="footer">
        <p>ยังไม่มีบัญชี? <a href="#">สมัครสมาชิก</a></p>
    </div>
</div>

</body>
</html>
