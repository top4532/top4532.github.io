<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    padding:20px;
}

.login-container{
    width:100%;
    max-width:420px;
}

.login-box{
    background:#fff;
    border-radius:25px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo i{
    width:90px;
    height:90px;
    line-height:90px;
    font-size:40px;
    color:#fff;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    border-radius:50%;
    box-shadow:0 10px 30px rgba(37,99,235,.3);
}

.logo h2{
    margin-top:15px;
    color:#1e293b;
}

.logo p{
    color:#64748b;
    font-size:14px;
    margin-top:5px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:600;
}

.input-box{
    position:relative;
}

.input-box i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#3b82f6;
}

.input-box input{
    width:100%;
    height:50px;
    border:2px solid #e2e8f0;
    border-radius:12px;
    padding-left:45px;
    padding-right:45px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.input-box input:focus{
    border-color:#2563eb;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#64748b;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:#475569;
}

.forgot{
    text-decoration:none;
    color:#2563eb;
    font-weight:600;
}

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.3);
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#64748b;
}

.footer a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

@media(max-width:480px){
    .login-box{
        padding:30px 25px;
    }
}
</style>
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            <i class="fas fa-user-shield"></i>
            <h2>เข้าสู่ระบบ</h2>
            <p>กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label>ชื่อผู้ใช้</label>

                <div class="input-box">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้">
                </div>
            </div>

            <div class="input-group">
                <label>รหัสผ่าน</label>

                <div class="input-box">
                    <i class="fas fa-lock"></i>

                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน">

                    <span class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    จดจำรหัสผ่าน
                </label>

                <a href="#" class="forgot">
                    ลืมรหัสผ่าน?
                </a>

            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-right-to-bracket"></i>
                เข้าสู่ระบบ
            </button>

        </form>

        <div class="footer">
            ยังไม่มีบัญชี?
            <a href="#">สมัครสมาชิก</a>
        </div>

    </div>

</div>

<script>
// เปิด-ปิด รหัสผ่าน
function togglePassword(){

    const password =
        document.getElementById("password");

    const eyeIcon =
        document.getElementById("eyeIcon");

    if(password.type === "password"){
        password.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
    }else{
        password.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
    }
}

// โหลดข้อมูลที่เคยจำไว้
window.onload = function(){

    const savedUser =
        localStorage.getItem("username");

    const savedPass =
        localStorage.getItem("password");

    if(savedUser){
        document.getElementById("username").value = savedUser;
    }

    if(savedPass){
        document.getElementById("password").value = savedPass;
        document.getElementById("rememberMe").checked = true;
    }
}

// บันทึกข้อมูล
document.getElementById("loginForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const remember =
        document.getElementById("rememberMe").checked;

    if(remember){

        localStorage.setItem(
            "username",
            username
        );

        localStorage.setItem(
            "password",
            password
        );

    }else{

        localStorage.removeItem("username");
        localStorage.removeItem("password");
    }

    alert("เข้าสู่ระบบสำเร็จ");
});
</script>

</body>
</html>
