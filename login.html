<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System - PATIWAT</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    padding:20px;
}

.login-container{
    width:100%;
    max-width:420px;
}

.login-box{
    background:#fff;
    border-radius:25px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
    animation:slideIn 0.5s ease-out;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo i{
    width:90px;
    height:90px;
    line-height:90px;
    font-size:40px;
    color:#fff;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    border-radius:50%;
    box-shadow:0 10px 30px rgba(37,99,235,.3);
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.logo h2{
    margin-top:15px;
    color:#1e293b;
    font-size:24px;
}

.logo p{
    color:#64748b;
    font-size:14px;
    margin-top:5px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:600;
    font-size:14px;
}

.input-box{
    position:relative;
}

.input-box i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#3b82f6;
    font-size:16px;
}

.input-box input{
    width:100%;
    height:50px;
    border:2px solid #e2e8f0;
    border-radius:12px;
    padding-left:45px;
    padding-right:45px;
    font-size:15px;
    outline:none;
    transition:.3s;
    background:#f8fafc;
}

.input-box input:focus{
    border-color:#2563eb;
    background:#fff;
    box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

.input-box input::placeholder{
    color:#cbd5e1;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#64748b;
    transition:.3s;
    font-size:16px;
}

.toggle-password:hover{
    color:#2563eb;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
    flex-wrap:wrap;
    gap:10px;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:#475569;
    cursor:pointer;
    user-select:none;
}

.remember input[type="checkbox"]{
    width:18px;
    height:18px;
    cursor:pointer;
    accent-color:#2563eb;
}

.forgot{
    text-decoration:none;
    color:#2563eb;
    font-weight:600;
    transition:.3s;
}

.forgot:hover{
    color:#1d4ed8;
    text-decoration:underline;
}

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.3);
}

.login-btn:active{
    transform:translateY(0);
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#64748b;
    font-size:14px;
}

.footer a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.footer a:hover{
    color:#1d4ed8;
    text-decoration:underline;
}

.error-message{
    color:#dc2626;
    font-size:13px;
    margin-top:5px;
    display:none;
}

.success-message{
    color:#16a34a;
    font-size:13px;
    margin-top:5px;
    display:none;
}

.back-home{
    margin-top:20px;
    text-align:center;
}

.back-home a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.back-home a:hover{
    gap:12px;
}

@media(max-width:480px){
    .login-box{
        padding:30px 25px;
    }
    
    .logo h2{
        font-size:20px;
    }
    
    .options{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            <i class="fas fa-user-shield"></i>
        </div>
        
        <div style="text-align:center;margin-bottom:30px;">
            <h2 style="color:#1e293b;font-size:24px;margin-bottom:5px;">เข้าสู่ระบบ</h2>
            <p style="color:#64748b;font-size:14px;">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label for="username">ชื่อผู้ใช้</label>

                <div class="input-box">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
                </div>
                <div class="error-message" id="usernameError"></div>
            </div>

            <div class="input-group">
                <label for="password">รหัสผ่าน</label>

                <div class="input-box">
                    <i class="fas fa-lock"></i>

                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>

                    <span class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    <span>จดจำรหัสผ่าน</span>
                </label>

                <a href="#" class="forgot" onclick="handleForgotPassword(event)">
                    ลืมรหัสผ่าน?
                </a>

            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-right-to-bracket"></i>
                เข้าสู่ระบบ
            </button>
            
            <div class="success-message" id="successMessage">✓ เข้าสู่ระบบสำเร็จ</div>

        </form>

        <div class="footer">
            ยังไม่มีบัญชี?
            <a href="#" onclick="handleSignup(event)">สมัครสมาชิก</a>
        </div>
        
        <div class="back-home">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i>
                กลับไปหน้าแรก
            </a>
        </div>

    </div>

</div>

<script>
// เปิด-ปิด รหัสผ่าน
function togglePassword(){
    const password = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    if(password.type === "password"){
        password.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
    }else{
        password.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
    }
}

// ตรวจสอบความถูกต้อง
function validateForm(){
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const usernameError = document.getElementById("usernameError");
    const passwordError = document.getElementById("passwordError");
    
    let isValid = true;
    
    usernameError.style.display = "none";
    passwordError.style.display = "none";
    
    if(username === ""){
        usernameError.textContent = "กรุณากรอกชื่อผู้ใช้";
        usernameError.style.display = "block";
        isValid = false;
    }else if(username.length < 3){
        usernameError.textContent = "ชื่อผู้ใช้ต้องมีอย่างน้อย 3 ตัวอักษร";
        usernameError.style.display = "block";
        isValid = false;
    }
    
    if(password === ""){
        passwordError.textContent = "กรุณากรอกรหัสผ่าน";
        passwordError.style.display = "block";
        isValid = false;
    }else if(password.length < 4){
        passwordError.textContent = "รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร";
        passwordError.style.display = "block";
        isValid = false;
    }
    
    return isValid;
}

// โหลดข้อมูลที่เคยจำไว้
window.onload = function(){
    const savedUser = localStorage.getItem("username");
    const savedPass = localStorage.getItem("password");

    if(savedUser){
        document.getElementById("username").value = savedUser;
    }

    if(savedPass){
        document.getElementById("password").value = savedPass;
        document.getElementById("rememberMe").checked = true;
    }
    
    // สำหรับ demo - สามารถลงชื่อเข้าโดยใช้ username: test, password: 1234
}

// บันทึกข้อมูลและเข้าสู่ระบบ
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    if(!validateForm()){
        return;
    }

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const remember = document.getElementById("rememberMe").checked;
    const loginBtn = document.getElementById("loginBtn");
    const successMessage = document.getElementById("successMessage");

    // ปิดปุ่มระหว่างการประมวลผล
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ...';

    // จำลองการยืนยันข้อมูล (ในจริงจะส่งไปที่เซิร์ฟเวอร์)
    setTimeout(function(){
        if(remember){
            localStorage.setItem("username", username);
            localStorage.setItem("password", password);
        }else{
            localStorage.removeItem("username");
            localStorage.removeItem("password");
        }

        // แสดงข้อความสำเร็จ
        successMessage.style.display = "block";
        
        // หลังจาก 1.5 วินาที นำไปยังหน้าหลัก
        setTimeout(function(){
            window.location.href = "index.html";
        }, 1500);
        
        // คืนค่าปุ่ม (กรณีกลับมา)
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-right-to-bracket"></i> เข้าสู่ระบบ';
    }, 1000);
});

// ลืมรหัสผ่าน
function handleForgotPassword(e){
    e.preventDefault();
    alert("ระบบกู้คืนรหัสผ่านจะส่งลิงค์ไปที่อีเมลของคุณ");
    // ในจริง จะมีฟอร์มกู้คืนรหัสผ่าน
}

// สมัครสมาชิก
function handleSignup(e){
    e.preventDefault();
    alert("หน้าสมัครสมาชิกจะเปิดให้ใช้งานเร็วๆนี้");
    // ในจริง จะมีหน้าสมัครสมาชิก
}

// ป้องกันการบันทึกรหัสผ่านไม่ปลอดภัย (เฉพาะเมื่อไม่ได้เลือก "จดจำรหัสผ่าน")
document.getElementById("rememberMe").addEventListener("change", function(){
    if(!this.checked){
        localStorage.removeItem("username");
        localStorage.removeItem("password");
    }
});
</script>

</body>
</html>
