<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System - PATIWAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --blue-50: #eff6ff;
  --blue-100: #dbeafe;
  --blue-200: #bfdbfe;
  --blue-300: #93c5fd;
  --blue-400: #60a5fa;
  --blue-500: #3b82f6;
  --blue-600: #2563eb;
  --blue-700: #1d4ed8;
  --blue-800: #1e40af;
  --blue-900: #1e3a8a;
  --sky-400: #38bdf8;
  --sky-500: #0ea5e9;
  --white: #ffffff;
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-600: #475569;
  --gray-700: #334155;
  --gray-800: #1e293b;
  --red-500: #ef4444;
  --green-500: #22c55e;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Prompt', sans-serif;
  background: #e8f0fe;
  overflow: hidden;
  position: relative;
}

/* Animated background */
.bg-scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 40%, #e0f2fe 70%, #bfdbfe 100%);
  overflow: hidden;
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  animation: floatOrb 8s ease-in-out infinite;
  opacity: 0.5;
}

.bg-orb:nth-child(1) {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #93c5fd, transparent);
  top: -150px; left: -100px;
  animation-delay: 0s;
}
.bg-orb:nth-child(2) {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #60a5fa, transparent);
  bottom: -100px; right: -80px;
  animation-delay: -3s;
}
.bg-orb:nth-child(3) {
  width: 300px; height: 300px;
  background: radial-gradient(circle, #38bdf8, transparent);
  top: 50%; left: 60%;
  animation-delay: -5s;
}

@keyframes floatOrb {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(20px, -30px) scale(1.05); }
  66% { transform: translate(-15px, 20px) scale(0.95); }
}

/* Grid pattern overlay */
.bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(37,99,235,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37,99,235,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* Floating particles */
.particle {
  position: absolute;
  border-radius: 50%;
  background: var(--blue-400);
  opacity: 0.2;
  animation: drift linear infinite;
}

@keyframes drift {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.2; }
  90% { opacity: 0.1; }
  100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
}

/* ─── Card ─── */
.card-wrap {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
  padding: 16px;
  animation: riseUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes riseUp {
  from { opacity: 0; transform: translateY(40px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 28px;
  padding: 44px 40px;
  border: 1.5px solid rgba(255,255,255,0.9);
  box-shadow:
    0 4px 6px -1px rgba(37,99,235,0.06),
    0 20px 60px rgba(37,99,235,0.15),
    0 0 0 1px rgba(147,197,253,0.3) inset;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--sky-400), var(--blue-500), var(--blue-700), var(--sky-400));
  background-size: 200% 100%;
  animation: shimmerBar 3s linear infinite;
}

@keyframes shimmerBar {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

/* ─── Logo ─── */
.logo-area {
  text-align: center;
  margin-bottom: 36px;
}

.logo-ring {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 80px; height: 80px;
  border-radius: 24px;
  background: linear-gradient(135deg, var(--sky-400), var(--blue-600));
  box-shadow: 0 12px 32px rgba(37,99,235,0.35), 0 0 0 6px rgba(147,197,253,0.2);
  animation: pulseLogo 3s ease-in-out infinite;
  position: relative;
}

@keyframes pulseLogo {
  0%, 100% { box-shadow: 0 12px 32px rgba(37,99,235,0.35), 0 0 0 6px rgba(147,197,253,0.2); }
  50% { box-shadow: 0 12px 40px rgba(37,99,235,0.5), 0 0 0 10px rgba(147,197,253,0.15); }
}

.logo-ring i {
  font-size: 36px;
  color: #fff;
}

.logo-title {
  margin-top: 18px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--gray-800);
  letter-spacing: -0.5px;
}

.logo-sub {
  margin-top: 6px;
  font-size: 13.5px;
  color: var(--gray-400);
  font-weight: 300;
  letter-spacing: 0.2px;
}

/* ─── Inputs ─── */
.field {
  margin-bottom: 20px;
}

.field label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 9px;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-600);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.field label i {
  font-size: 11px;
  color: var(--blue-400);
}

.input-wrap {
  position: relative;
}

.input-wrap input {
  width: 100%;
  height: 52px;
  border: 1.5px solid var(--blue-100);
  border-radius: 14px;
  padding: 0 50px 0 18px;
  font-size: 15px;
  font-family: 'Prompt', sans-serif;
  font-weight: 400;
  outline: none;
  background: rgba(239,246,255,0.5);
  color: var(--gray-800);
  transition: all 0.25s ease;
}

.input-wrap input::placeholder {
  color: var(--gray-300);
  font-weight: 300;
}

.input-wrap input:focus {
  border-color: var(--blue-400);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(96,165,250,0.15);
}

.input-wrap .icon-right {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gray-400);
  cursor: pointer;
  font-size: 15px;
  transition: color 0.2s;
}

.input-wrap .icon-right:hover { color: var(--blue-500); }

.err-msg {
  font-size: 12px;
  color: var(--red-500);
  margin-top: 5px;
  display: none;
  padding-left: 4px;
}

/* ─── Options row ─── */
.options-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 10px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  user-select: none;
  font-size: 13.5px;
  color: var(--gray-600);
}

.remember input[type="checkbox"] {
  width: 17px; height: 17px;
  cursor: pointer;
  accent-color: var(--blue-500);
  border-radius: 4px;
}

.forgot-link {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--blue-600);
  text-decoration: none;
  transition: color 0.2s;
}

.forgot-link:hover { color: var(--blue-800); }

/* ─── Button ─── */
.btn-login {
  width: 100%;
  height: 54px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--sky-400) 0%, var(--blue-600) 100%);
  color: #fff;
  font-size: 15.5px;
  font-weight: 600;
  font-family: 'Prompt', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  letter-spacing: 0.3px;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 6px 20px rgba(37,99,235,0.35);
}

.btn-login::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.btn-login:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(37,99,235,0.45);
}

.btn-login:hover::after { opacity: 1; }
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

/* ─── Success ─── */
.success-msg {
  display: none;
  text-align: center;
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.25);
  color: #15803d;
  font-size: 13.5px;
  font-weight: 600;
}

/* ─── Footer links ─── */
.card-footer {
  text-align: center;
  margin-top: 28px;
  font-size: 13.5px;
  color: var(--gray-400);
}

.card-footer a {
  color: var(--blue-600);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s;
}

.card-footer a:hover { color: var(--blue-800); }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0;
}

.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--blue-100);
}

.divider span {
  font-size: 12px;
  color: var(--gray-300);
  letter-spacing: 0.5px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--blue-500);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: gap 0.2s, color 0.2s;
  margin-top: 6px;
}

.back-btn:hover { gap: 11px; color: var(--blue-700); }

/* ─── Responsive ─── */
@media (max-width: 480px) {
  .card { padding: 36px 28px; }
  .logo-title { font-size: 22px; }
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-scene">
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-grid"></div>
</div>

<!-- Card -->
<div class="card-wrap">
  <div class="card">

    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-ring">
        <i class="fas fa-user-shield"></i>
      </div>
      <div class="logo-title">เข้าสู่ระบบ</div>
      <div class="logo-sub">กรุณาเข้าสู่ระบบเพื่อใช้งาน</div>
    </div>

    <!-- Form -->
    <form id="loginForm">

      <div class="field">
        <label><i class="fas fa-circle-dot"></i> ชื่อผู้ใช้</label>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" autocomplete="username" required>
          <span class="icon-right"><i class="fas fa-user"></i></span>
        </div>
        <div class="err-msg" id="usernameError"></div>
      </div>

      <div class="field">
        <label><i class="fas fa-circle-dot"></i> รหัสผ่าน</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>
          <span class="icon-right" onclick="togglePassword()" title="แสดง/ซ่อนรหัสผ่าน">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </span>
        </div>
        <div class="err-msg" id="passwordError"></div>
      </div>

      <div class="options-row">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          <span>จดจำรหัสผ่าน</span>
        </label>
        <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">ลืมรหัสผ่าน?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-right-to-bracket"></i>
        เข้าสู่ระบบ
      </button>

      <div class="success-msg" id="successMessage">
        <i class="fas fa-circle-check"></i>&nbsp; เข้าสู่ระบบสำเร็จ! กำลังนำไปยังหน้าหลัก…
      </div>

    </form>

    <div class="divider"><span>หรือ</span></div>

    <div class="card-footer">
      ยังไม่มีบัญชี?
      <a href="#" onclick="handleSignup(event)">สมัครสมาชิก</a>
    </div>

    <div style="text-align:center;margin-top:14px;">
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        กลับไปหน้าแรก
      </a>
    </div>

  </div>
</div>

<script>
/* ─── Particles ─── */
(function(){
  const scene = document.querySelector('.bg-scene');
  for(let i = 0; i < 12; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 3;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*15+10}s;
      animation-delay:${Math.random()*-20}s;
    `;
    scene.appendChild(p);
  }
})();

/* ─── Toggle password ─── */
function togglePassword(){
  const pw = document.getElementById('password');
  const ic = document.getElementById('eyeIcon');
  if(pw.type === 'password'){
    pw.type = 'text';
    ic.classList.replace('fa-eye','fa-eye-slash');
  } else {
    pw.type = 'password';
    ic.classList.replace('fa-eye-slash','fa-eye');
  }
}

/* ─── Validate ─── */
function validateForm(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const ue = document.getElementById('usernameError');
  const pe = document.getElementById('passwordError');
  let ok = true;

  ue.style.display = 'none';
  pe.style.display = 'none';

  if(!u){ ue.textContent = 'กรุณากรอกชื่อผู้ใช้'; ue.style.display='block'; ok=false; }
  else if(u.length < 3){ ue.textContent = 'ชื่อผู้ใช้ต้องมีอย่างน้อย 3 ตัวอักษร'; ue.style.display='block'; ok=false; }

  if(!p){ pe.textContent = 'กรุณากรอกรหัสผ่าน'; pe.style.display='block'; ok=false; }
  else if(p.length < 4){ pe.textContent = 'รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'; pe.style.display='block'; ok=false; }

  return ok;
}

/* ─── Load saved ─── */
window.onload = function(){
  const su = localStorage.getItem('username');
  const sp = localStorage.getItem('password');
  if(su){ document.getElementById('username').value = su; }
  if(sp){ document.getElementById('password').value = sp; document.getElementById('rememberMe').checked = true; }
};

/* ─── Submit ─── */
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  if(!validateForm()) return;

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('rememberMe').checked;
  const btn = document.getElementById('loginBtn');
  const succ = document.getElementById('successMessage');

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ…';

  setTimeout(function(){
    if(remember){
      localStorage.setItem('username', username);
      localStorage.setItem('password', password);
    } else {
      localStorage.removeItem('username');
      localStorage.removeItem('password');
    }
    succ.style.display = 'block';
    setTimeout(function(){ window.location.href = 'index.html'; }, 1500);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> เข้าสู่ระบบ';
  }, 1000);
});

/* ─── Forgot / Signup ─── */
function handleForgotPassword(e){
  e.preventDefault();
  alert('ระบบกู้คืนรหัสผ่านจะส่งลิงค์ไปที่อีเมลของคุณ');
}
function handleSignup(e){
  e.preventDefault();
  alert('หน้าสมัครสมาชิกจะเปิดให้ใช้งานเร็วๆนี้');
}

/* ─── Uncheck clears saved ─── */
document.getElementById('rememberMe').addEventListener('change', function(){
  if(!this.checked){ localStorage.removeItem('username'); localStorage.removeItem('password'); }
});
</script>
</body>
</html>
