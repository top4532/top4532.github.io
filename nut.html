<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>NUT SYSTEM — ระบบจัดการน็อตล้อ | 4 หมวดหมู่หลัก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f5ff;
    --bg2: #e6eeff;
    --surface: #ffffff;
    --surface2: #f7f9ff;
    --blue: #2563eb;
    --blue-mid: #3b82f6;
    --blue-light: #dbeafe;
    --blue-xlight: #eff6ff;
    --blue-dark: #1d4ed8;
    --blue-deep: #1e3a8a;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --border: rgba(37,99,235,0.1);
    --border-mid: rgba(37,99,235,0.2);
    --shadow-sm: 0 1px 3px rgba(37,99,235,0.08), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(37,99,235,0.12), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 12px 40px rgba(37,99,235,0.18), 0 4px 8px rgba(0,0,0,0.04);
    --red: #ef4444;
    --red-light: #fee2e2;
    --green: #10b981;
    --sans: 'Outfit', sans-serif;
    --thai: 'IBM Plex Sans Thai', sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --sidebar-width: 260px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--thai);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(37,99,235,0.08) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 400px;
    background: linear-gradient(180deg, rgba(219,234,254,0.6) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .app-layout {
    display: flex;
    min-height: 100vh;
    position: relative;
    z-index: 2;
  }

  /* ========= SIDEBAR ========= */
  .sidebar {
    width: var(--sidebar-width);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 20px rgba(37,99,235,0.06);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    transition: all 0.2s;
    z-index: 10;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 32px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .mini-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .mini-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #2563eb, #60a5fa);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 2px 8px rgba(37,99,235,0.3);
  }
  .mini-title {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
  }
  .mini-title span { color: var(--blue); }
  .sidebar-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .stat-summary {
    margin-top: 24px;
    background: var(--blue-xlight);
    border-radius: 20px;
    padding: 16px;
  }
  .stat-summary p {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--blue-dark);
    margin-bottom: 12px;
  }
  .total-badge {
    background: var(--surface);
    border-radius: 16px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--sans);
  }
  .total-label {
    font-size: 12px;
    color: var(--text-muted);
  }
  .total-number {
    font-size: 24px;
    font-weight: 700;
    color: var(--blue);
  }

  .sidebar-nav {
    flex: 1;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }

  .nav-section-label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 14px 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: 14px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 14px;
    color: var(--text-muted);
    transition: all 0.2s;
    cursor: pointer;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
  }
  .nav-item i { font-size: 18px; width: 24px; }
  .nav-item:hover { background: var(--blue-xlight); color: var(--blue); }
  .nav-item.active {
    background: var(--blue-light);
    color: var(--blue-dark);
    font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--surface);
  }

  .nav-divider {
    height: 1px;
    background: var(--border);
    margin: 8px 4px;
  }

  .sidebar-footer {
    padding: 16px 20px 28px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-dim);
  }

  /* MAIN CONTENT */
  .main-content {
    flex: 1;
    padding: 32px 32px 60px;
    max-width: calc(100% - var(--sidebar-width));
    transition: all 0.2s;
  }

  .header-area {
    margin-bottom: 28px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-icon {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, #2563eb, #60a5fa);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(37,99,235,0.35);
    font-size: 24px;
    flex-shrink: 0;
  }

  .brand-eyebrow {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--blue-mid);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .brand-title {
    font-family: var(--sans);
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
  }
  .brand-title span { color: var(--blue); }
  .brand-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge-live {
    display: flex; align-items: center; gap: 6px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: var(--green);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 99px;
    letter-spacing: 0.05em;
  }
  .badge-live::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .btn-export, .btn-reset-all {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    color: var(--blue);
    border: 1px solid var(--border-mid);
    border-radius: 99px;
    padding: 7px 18px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-export:hover {
    background: var(--blue-xlight);
    border-color: var(--blue);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn-reset-all {
    color: var(--red);
    border-color: rgba(239,68,68,0.3);
  }
  .btn-reset-all:hover {
    background: var(--red-light);
    border-color: var(--red);
    color: var(--red);
    transform: translateY(-1px);
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 8px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s;
    cursor: pointer;
  }
  .stat-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    border-color: var(--border-mid);
  }

  .stat-icon {
    width: 38px; height: 38px;
    background: var(--blue-xlight);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .stat-cat {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .stat-num {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    color: var(--blue);
    line-height: 1.1;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    margin-top: 32px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all 0.25s;
  }
  .card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-3px);
    border-color: var(--border-mid);
  }

  .card-stripe {
    height: 4px;
    background: linear-gradient(90deg, #2563eb, #60a5fa, #93c5fd);
  }

  .card-header {
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .cat-left {
    display: flex; align-items: center; gap: 10px;
  }

  .cat-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-light);
  }

  .cat-name {
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .cat-pill {
    background: var(--blue-xlight);
    color: var(--blue);
    border: 1px solid var(--blue-light);
    border-radius: 99px;
    padding: 3px 10px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
  }

  .nut-list {
    list-style: none;
    flex: 1;
    overflow-y: auto;
    max-height: 320px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    scrollbar-width: thin;
    scrollbar-color: var(--blue-light) transparent;
  }
  .nut-list::-webkit-scrollbar { width: 4px; }
  .nut-list::-webkit-scrollbar-thumb { background: var(--blue-light); border-radius: 2px; }

  .nut-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 99px;
    border: 1px solid transparent;
    background: transparent;
    transition: all 0.15s;
    animation: item-in 0.2s ease;
  }
  @keyframes item-in {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .nut-item:hover {
    background: var(--blue-xlight);
    border-color: var(--blue-light);
  }

  .item-idx {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    width: 22px;
    flex-shrink: 0;
    text-align: center;
  }

  .item-dot-small {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--blue-mid);
    flex-shrink: 0;
    opacity: 0.5;
  }

  .item-val {
    flex: 1;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  .btn-del {
    width: 26px; height: 26px;
    border-radius: 30px;
    border: none;
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    transition: all 0.15s;
    flex-shrink: 0;
    line-height: 1;
  }
  .btn-del:hover {
    background: var(--red-light);
    color: var(--red);
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    gap: 8px;
  }
  .empty-icon { font-size: 32px; opacity: 0.2; }
  .empty-txt {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .card-foot {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
  }

  .foot-count {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--text-muted);
  }
  .foot-count b { color: var(--blue); }

  .btn-clear {
    background: none;
    border: none;
    font-family: var(--sans);
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 6px;
    transition: all 0.15s;
    font-weight: 500;
  }
  .btn-clear:hover { color: var(--red); background: var(--red-light); }

  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--blue-deep);
    color: #fff;
    border-radius: 99px;
    padding: 10px 22px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    box-shadow: 0 8px 28px rgba(30,58,138,0.4);
    white-space: nowrap;
  }
  .toast.error { background: var(--red); box-shadow: 0 8px 28px rgba(239,68,68,0.3); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bottom-info-bar {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border-mid);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .add-area {
    background: var(--surface);
    border-radius: 60px;
    padding: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border-mid);
    box-shadow: var(--shadow-sm);
  }
  .add-input {
    border: none;
    padding: 8px 14px;
    font-family: var(--sans);
    font-size: 12px;
    border-radius: 60px;
    background: transparent;
    outline: none;
    width: 140px;
  }
  .add-input:focus { background: var(--blue-xlight); }
  .add-btn {
    background: var(--blue);
    border: none;
    color: white;
    padding: 6px 14px;
    border-radius: 60px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  .add-btn:hover { background: var(--blue-dark); }

  @media (max-width: 780px) {
    .sidebar { width: 220px; }
    .main-content { padding: 20px; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .brand-title { font-size: 22px; }
  }
  @media (max-width: 650px) {
    .app-layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
      flex-direction: row;
      flex-wrap: wrap;
      padding: 12px 16px;
      backdrop-filter: blur(16px);
    }
    .sidebar-header { padding: 8px 0; border-bottom: none; width: 100%; }
    .sidebar-nav { flex-direction: row; padding: 8px; gap: 6px; flex-wrap: wrap; }
    .nav-item { width: auto; padding: 6px 12px; }
    .main-content { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="mini-logo">
        <div class="mini-icon">⚙️</div>
        <div>
          <div class="mini-title">NUT<span>SYSTEM</span></div>
          <div class="sidebar-sub">ระบบจัดการน็อตล้อ</div>
        </div>
      </div>
      <div class="stat-summary">
        <p>📊 สรุปทั้งหมด</p>
        <div class="total-badge">
          <span class="total-label">จำนวนน็อตทั้งหมด</span>
          <span class="total-number" id="global-total-count">0</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <!-- หมวดหมู่ -->
      <div class="nav-section-label">หมวดหมู่</div>

      <button class="nav-item active" data-cat="3RHB" onclick="switchCat('3RHB', this)">
        🔩 3RHB
      </button>

      <button class="nav-item" data-cat="3FHB" onclick="switchCat('3FHB', this)">
        🔩 3FHB
      </button>

      <button class="nav-item" data-cat="3FHN" onclick="switchCat('3FHN', this)">
        🔩 3FHN
      </button>

      <button class="nav-item" data-cat="3RHN" onclick="switchCat('3RHN', this)">
        🔩 3RHN
      </button>
    </nav>

    <div class="sidebar-footer">
      <div>© Workshop Manager | NUT SYSTEM</div>
      <div style="margin-top: 6px;">⚡ ข้อมูลถูกบันทึกใน LocalStorage | ไม่มีข้อมูลเริ่มต้น</div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="header-area">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">🔩</div>
          <div class="brand-text">
            <div class="brand-eyebrow">NUT MANAGEMENT</div>
            <div class="brand-title">NUT <span>SYSTEM</span></div>
            <div class="brand-sub">ระบบจัดการน็อตล้อรถยนต์ 4 กลุ่มหลัก</div>
          </div>
        </div>
        <div class="header-actions">
          <div class="badge-live">LOCAL STORAGE</div>
          <button class="btn-export" id="exportDataBtn">📎 ส่งออก JSON</button>
          <button class="btn-reset-all" id="resetAllBtn">🗑️ รีเซ็ตทั้งหมด</button>
        </div>
      </div>

      <!-- Stat row -->
      <div class="stat-row" id="statRow"></div>
    </div>

    <!-- Cards grid — แสดงเฉพาะหมวดที่เลือก -->
    <div class="cards-grid" id="cardsGrid"></div>

    <div class="bottom-info-bar">
      <span>NUT SYSTEM v1.0 — ข้อมูลบันทึกใน LocalStorage</span>
      <span id="lastSaved"></span>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ====== CONFIG ====== */
  const CATEGORIES = ['3RHB', '3FHB', '3FHN', '3RHN'];
  const CAT_ICONS  = { '3RHB': '🔩', '3FHB': '🔧', '3FHN': '⚙️', '3RHN': '🔑' };
  const STORAGE_KEY = 'nutSystem_v1';

  /* ====== STATE ====== */
  let data = {};          // { cat: [items...] }
  let currentCat = '3RHB';

  /* ====== STORAGE ====== */
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : {};
    } catch(e) { data = {}; }
    CATEGORIES.forEach(c => { if (!data[c]) data[c] = []; });
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    const el = document.getElementById('lastSaved');
    if (el) el.textContent = 'บันทึกล่าสุด: ' + new Date().toLocaleTimeString('th-TH');
  }

  /* ====== TOAST ====== */
  let toastTimer;
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast', 2200);
  }

  /* ====== SWITCH CATEGORY (sidebar) ====== */
  function switchCat(cat, el) {
    currentCat = cat;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderAll();
  }

  /* ====== RENDER STATS ====== */
  function renderStats() {
    const row = document.getElementById('statRow');
    row.innerHTML = CATEGORIES.map(c => `
      <div class="stat-card" onclick="switchCat('${c}', document.querySelector('[data-cat=${c}]'))">
        <div class="stat-icon">${CAT_ICONS[c]}</div>
        <div class="stat-info">
          <div class="stat-cat">${c}</div>
          <div class="stat-num">${data[c].length}</div>
        </div>
      </div>
    `).join('');

    const total = CATEGORIES.reduce((s, c) => s + data[c].length, 0);
    document.getElementById('global-total-count').textContent = total;
  }

  /* ====== RENDER CARD (single category) ====== */
  function renderCard(cat) {
    const items = data[cat];
    const listHtml = items.length === 0
      ? `<div class="empty-state">
           <div class="empty-icon">${CAT_ICONS[cat]}</div>
           <div class="empty-txt">ยังไม่มีน็อตในหมวดนี้</div>
         </div>`
      : items.map((v, i) => `
          <li class="nut-item">
            <span class="item-idx">${i + 1}</span>
            <span class="item-dot-small"></span>
            <span class="item-val">${escHtml(v)}</span>
            <button class="btn-del" title="ลบ" onclick="deleteItem('${cat}', ${i})">✕</button>
          </li>`).join('');

    return `
      <div class="card" id="card-${cat}">
        <div class="card-stripe"></div>
        <div class="card-header">
          <div class="cat-left">
            <div class="cat-dot"></div>
            <div class="cat-name">${CAT_ICONS[cat]} ${cat}</div>
          </div>
          <span class="cat-pill">${items.length} รายการ</span>
        </div>
        <ul class="nut-list">${listHtml}</ul>
        <div class="card-foot">
          <span class="foot-count">ทั้งหมด <b>${items.length}</b> รายการ</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="add-area">
              <input class="add-input" id="inp-${cat}" placeholder="เพิ่มน็อต..." onkeydown="if(event.key==='Enter')addItem('${cat}')">
              <button class="add-btn" onclick="addItem('${cat}')">+ เพิ่ม</button>
            </div>
            <button class="btn-clear" onclick="clearCat('${cat}')">ล้างทั้งหมด</button>
          </div>
        </div>
      </div>`;
  }

  /* ====== RENDER ALL ====== */
  function renderAll() {
    renderStats();
    const grid = document.getElementById('cardsGrid');
    // แสดงเฉพาะหมวดที่เลือกจาก sidebar
    grid.innerHTML = renderCard(currentCat);
  }

  /* ====== ADD / DELETE / CLEAR ====== */
  function addItem(cat) {
    const inp = document.getElementById('inp-' + cat);
    const val = inp.value.trim();
    if (!val) { showToast('กรุณากรอกชื่อน็อต', true); return; }
    data[cat].push(val);
    inp.value = '';
    saveData();
    renderAll();
    showToast(`เพิ่ม "${val}" ใน ${cat} แล้ว ✓`);
  }

  function deleteItem(cat, idx) {
    const removed = data[cat].splice(idx, 1)[0];
    saveData();
    renderAll();
    showToast(`ลบ "${removed}" ออกแล้ว`);
  }

  function clearCat(cat) {
    if (!confirm(`ล้างน็อตทั้งหมดใน ${cat} ใช่หรือไม่?`)) return;
    data[cat] = [];
    saveData();
    renderAll();
    showToast(`ล้างหมวด ${cat} แล้ว`);
  }

  /* ====== EXPORT ====== */
  document.getElementById('exportDataBtn').addEventListener('click', () => {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: 'nut-system-data.json' });
    a.click();
    URL.revokeObjectURL(url);
    showToast('ส่งออก JSON แล้ว ✓');
  });

  /* ====== RESET ALL ====== */
  document.getElementById('resetAllBtn').addEventListener('click', () => {
    if (!confirm('รีเซ็ตข้อมูลทั้งหมดหรือไม่?')) return;
    CATEGORIES.forEach(c => data[c] = []);
    saveData();
    renderAll();
    showToast('รีเซ็ตทั้งหมดแล้ว');
  });

  /* ====== HELPERS ====== */
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ====== INIT ====== */
  loadData();
  renderAll();
</script>
</body>
</html>
