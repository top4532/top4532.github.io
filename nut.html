<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUT SYSTEM — ระบบบันทึกน็อตล้อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c15;
    --bg-card: #11131f;
    --bg-card-hover: #161a2c;
    --surface: #1a1e2e;
    --surface2: #0f1119;
    --blue: #3b82f6;
    --blue-glow: rgba(59,130,246,0.3);
    --blue-light: #60a5fa;
    --blue-dark: #1d4ed8;
    --cyan: #06b6d4;
    --purple: #8b5cf6;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --border: rgba(59,130,246,0.15);
    --border-glow: rgba(59,130,246,0.4);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --shadow-glow: 0 0 20px rgba(59,130,246,0.15);
    --radius: 14px;
    --radius-lg: 20px;
    --sans: 'Outfit', sans-serif;
    --thai: 'IBM Plex Sans Thai', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--thai);
    min-height: 100vh;
    background-image: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.08) 0%, transparent 50%);
  }

  /* animated bg */
  .bg-orb {
    position: fixed;
    width: 60vw;
    height: 60vw;
    top: -20vh;
    right: -20vw;
    background: radial-gradient(circle, rgba(59,130,246,0.15), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .bg-orb2 {
    position: fixed;
    width: 50vw;
    height: 50vw;
    bottom: -20vh;
    left: -20vw;
    background: radial-gradient(circle, rgba(139,92,246,0.1), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 2;
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 32px 60px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(59,130,246,0.12);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(59,130,246,0.25);
    border-radius: 100px;
    padding: 6px 18px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--blue-light);
    margin-bottom: 20px;
  }
  .badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
  }
  h1 {
    font-family: var(--sans);
    font-size: 42px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff, var(--blue-light), #a78bfa);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--text-muted);
    margin-top: 12px;
    font-size: 15px;
  }
  .header-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 28px;
  }
  .btn-export {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 24px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-export:hover {
    background: rgba(59,130,246,0.15);
    border-color: var(--blue);
    color: var(--blue-light);
    transform: translateY(-2px);
  }

  /* 4 columns layout — fixed grid */
  .cards-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin: 32px 0;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(4px);
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    padding: 1px;
    background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(139,92,246,0.1));
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover::before {
    opacity: 1;
  }
  .card:hover {
    transform: translateY(-6px);
    background: var(--bg-card-hover);
    border-color: var(--border-glow);
    box-shadow: var(--shadow-glow);
  }

  .card-header {
    padding: 20px 18px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(59,130,246,0.1);
  }
  .cat-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cat-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(139,92,246,0.1));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .cat-name {
    font-family: var(--sans);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff, #94a3b8);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }
  .badge-count {
    background: rgba(59,130,246,0.15);
    border-radius: 40px;
    padding: 4px 12px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--blue-light);
  }

  /* input area */
  .card-input {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(59,130,246,0.08);
  }
  .input-group {
    display: flex;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 60px;
    padding: 4px 4px 4px 16px;
    transition: all 0.2s;
  }
  .input-group:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
  }
  .nut-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 0;
  }
  .nut-input::placeholder {
    color: var(--text-dim);
    font-size: 12px;
  }
  .btn-add {
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    border: none;
    border-radius: 40px;
    padding: 6px 18px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-add:hover {
    opacity: 0.85;
    transform: scale(0.96);
  }

  /* list */
  .nut-list {
    list-style: none;
    flex: 1;
    max-height: 260px;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .nut-list::-webkit-scrollbar {
    width: 3px;
  }
  .nut-list::-webkit-scrollbar-thumb {
    background: var(--blue);
    border-radius: 4px;
  }
  .nut-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.02);
    border-radius: 50px;
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .nut-item:hover {
    background: rgba(59,130,246,0.08);
    border-color: rgba(59,130,246,0.2);
  }
  .item-number {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    width: 22px;
  }
  .item-value {
    flex: 1;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
  }
  .btn-del {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .btn-del:hover {
    background: rgba(239,68,68,0.2);
    color: #ef4444;
  }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* footer per card */
  .card-footer {
    padding: 10px 16px;
    border-top: 1px solid rgba(59,130,246,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.2);
  }
  .total-items {
    font-size: 11px;
    color: var(--text-muted);
  }
  .total-items strong {
    color: var(--blue-light);
  }
  .btn-clear {
    background: transparent;
    border: none;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 30px;
    transition: all 0.15s;
  }
  .btn-clear:hover {
    background: rgba(239,68,68,0.15);
    color: #ef4444;
  }

  /* bottom bar */
  .bottom-bar {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid rgba(59,130,246,0.12);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 12px;
  }
  .grand-total {
    color: var(--blue-light);
    font-weight: 600;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e293b;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 60px;
    padding: 10px 24px;
    font-size: 13px;
    font-weight: 500;
    color: white;
    opacity: 0;
    transition: all 0.2s ease;
    pointer-events: none;
    z-index: 1000;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error {
    background: #7f1a1a;
    border-color: #ef4444;
  }

  @media (max-width: 900px) {
    .cards-row {
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .wrapper {
      padding: 24px 20px;
    }
    h1 { font-size: 32px; }
  }
  @media (max-width: 550px) {
    .cards-row {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div class="bg-orb"></div>
<div class="bg-orb2"></div>

<div class="wrapper">
  <div class="header">
    <div class="badge">SYSTEM ONLINE</div>
    <h1>NUT BOLT<br>MANAGEMENT</h1>
    <div class="sub">จัดการข้อมูลน็อตล้อ ทั้ง 4 หมวดหมู่</div>
    <div class="header-actions">
      <button class="btn-export" id="btn-export">📎 EXPORT JSON</button>
    </div>
  </div>

  <!-- 4 columns fixed layout -->
  <div class="cards-row" id="app"></div>

  <div class="bottom-bar">
    <span>📦 ข้อมูลถูกเก็บใน LocalStorage</span>
    <span>รวมทั้งหมด <span id="grand-total" class="grand-total">0</span> รายการ</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CATS = ["3RHB", "3FHB", "3RHN", "3FHN"];
  const ICONS = { "3RHB":"🔩","3FHB":"⚙️","3RHN":"🔧","3FHN":"🛞" };

  function loadData(cat) {
    try {
      return JSON.parse(localStorage.getItem(`nut_${cat}`) || "[]");
    } catch(e) { return []; }
  }
  function saveData(cat, arr) {
    localStorage.setItem(`nut_${cat}`, JSON.stringify(arr));
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast" + (isError ? " error" : "");
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  function updateGrandTotal() {
    const total = CATS.reduce((sum, cat) => sum + loadData(cat).length, 0);
    document.getElementById("grand-total").innerText = total;
  }

  function renderList(cat) {
    const items = loadData(cat);
    const container = document.getElementById(`list-${cat}`);
    const countBadge = document.getElementById(`badge-${cat}`);
    const totalSpan = document.getElementById(`total-${cat}`);
    
    if (countBadge) countBadge.innerText = items.length;
    if (totalSpan) totalSpan.innerHTML = `<strong>${items.length}</strong> รายการ`;
    
    if (!container) return;
    
    if (items.length === 0) {
      container.innerHTML = `<div class="empty-state">✨ ไม่มีข้อมูล</div>`;
      return;
    }
    
    container.innerHTML = items.map((val, idx) => `
      <li class="nut-item">
        <span class="item-number">${String(idx+1).padStart(2,'0')}</span>
        <span class="item-value">${escapeHtml(val)}</span>
        <button class="btn-del" data-cat="${cat}" data-index="${idx}">✕</button>
      </li>
    `).join("");
    
    // bind delete events
    container.querySelectorAll(".btn-del").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const c = btn.dataset.cat;
        const idx = parseInt(btn.dataset.index);
        const arr = loadData(c);
        if (!isNaN(idx) && idx >= 0 && idx < arr.length) {
          arr.splice(idx, 1);
          saveData(c, arr);
          renderList(c);
          updateGrandTotal();
          showToast(`🗑️ ลบรายการออกแล้ว`, false);
        }
      });
    });
  }

  function addItem(cat, value) {
    if (!value || value.trim() === "") {
      showToast("กรุณากรอกข้อมูล", true);
      return false;
    }
    const trimmed = value.trim().toUpperCase();
    const arr = loadData(cat);
    if (arr.includes(trimmed)) {
      showToast("⚠️ มีข้อมูลนี้อยู่แล้ว", true);
      return false;
    }
    arr.push(trimmed);
    saveData(cat, arr);
    renderList(cat);
    updateGrandTotal();
    showToast(`✅ เพิ่ม ${trimmed} ใน ${cat}`);
    return true;
  }

  function clearAll(cat) {
    if (loadData(cat).length === 0) {
      showToast(`ไม่มีข้อมูลใน ${cat}`, true);
      return;
    }
    if (confirm(`⚠️ ลบทั้งหมดในหมวด ${cat} ?`)) {
      saveData(cat, []);
      renderList(cat);
      updateGrandTotal();
      showToast(`🧹 ลบทั้งหมดใน ${cat} แล้ว`);
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function buildUI() {
    const app = document.getElementById("app");
    app.innerHTML = CATS.map(cat => `
      <div class="card" data-cat="${cat}">
        <div class="card-header">
          <div class="cat-title">
            <div class="cat-icon">${ICONS[cat]}</div>
            <div class="cat-name">${cat}</div>
          </div>
          <div class="badge-count" id="badge-${cat}">0</div>
        </div>
        <div class="card-input">
          <div class="input-group">
            <input type="text" class="nut-input" id="input-${cat}" placeholder="ระบุรุ่นน็อต เช่น M12x1.5" autocomplete="off">
            <button class="btn-add" data-cat="${cat}">+ เพิ่ม</button>
          </div>
        </div>
        <ul class="nut-list" id="list-${cat}"></ul>
        <div class="card-footer">
          <span class="total-items" id="total-${cat}"><strong>0</strong> รายการ</span>
          <button class="btn-clear" data-cat="${cat}">🗑️ ลบทั้งหมด</button>
        </div>
      </div>
    `).join("");

    // bind add events
    CATS.forEach(cat => {
      renderList(cat);
      const addBtn = document.querySelector(`.btn-add[data-cat="${cat}"]`);
      const input = document.getElementById(`input-${cat}`);
      if (addBtn) {
        addBtn.addEventListener("click", () => {
          const val = input.value;
          if (addItem(cat, val)) input.value = "";
        });
      }
      if (input) {
        input.addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            const val = input.value;
            if (addItem(cat, val)) input.value = "";
          }
        });
      }
      const clearBtn = document.querySelector(`.btn-clear[data-cat="${cat}"]`);
      if (clearBtn) {
        clearBtn.addEventListener("click", () => clearAll(cat));
      }
    });
    updateGrandTotal();
  }

  // export json
  document.getElementById("btn-export").addEventListener("click", () => {
    const exportData = {};
    CATS.forEach(cat => {
      exportData[cat] = loadData(cat);
    });
    const dataStr = JSON.stringify(exportData, null, 2);
    const blob = new Blob([dataStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `nut_export_${new Date().toISOString().slice(0,19)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("📁 ดาวน์โหลด JSON สำเร็จ");
  });

  buildUI();
</script>
</body>
</html>
