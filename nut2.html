<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUT2 | จัดการสินค้าทุกประเภท</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#1e6fdf',
                    primaryDark: '#0f5bc2',
                    navy: '#0a2b4e',
                    nut: '#f59e0b',
                    bushing: '#10b981',
                    rubber: '#8b5cf6',
                }
            }
        }
    }
</script>
<style>
    body {
        background: linear-gradient(135deg, #e6f0ff, #f0f7ff);
    }
    .card-hover:hover {
        transform: translateY(-5px);
        transition: all 0.3s ease;
    }
    .category-tab {
        transition: all 0.2s ease;
    }
    .category-tab.active {
        background: linear-gradient(135deg, #1e6fdf, #0f5bc2);
        color: white;
        box-shadow: 0 4px 12px rgba(30,111,223,0.3);
    }
</style>
</head>
<body class="min-h-screen p-5 md:p-8">

<div class="max-w-[1500px] mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-3xl p-5 md:p-6 flex flex-wrap justify-between items-center gap-4 shadow-md border border-blue-100 mb-6">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-xl flex items-center justify-center text-white text-xl">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <div>
                <h2 class="text-xl md:text-2xl font-bold text-navy">
                    <i class="fa-solid fa-database text-emerald-500 mr-2"></i>
                    NUT2 - คลังสินค้าอะไหล่รถยนต์
                </h2>
                <p class="text-gray-500 text-sm">น็อตล้อ | บูชปีกนก | ยางกันฝุ่น</p>
            </div>
        </div>
        <button onclick="window.location.href='New.html';" 
                class="bg-primary hover:bg-primaryDark text-white font-semibold px-5 py-2 rounded-full transition flex items-center gap-2 shadow-md">
            <i class="fa-solid fa-arrow-right"></i>
            ไปที่ NEW MODEL
        </button>
    </div>

    <!-- Category Tabs -->
    <div class="bg-white rounded-2xl p-3 shadow-md border border-blue-100 mb-6">
        <div class="flex flex-wrap gap-3">
            <button data-category="all" class="category-tab active px-6 py-2.5 rounded-xl font-semibold transition flex items-center gap-2 bg-gradient-to-r from-primary to-primaryDark text-white shadow-md">
                <i class="fa-solid fa-border-all"></i> ทั้งหมด
            </button>
            <button data-category="น็อตล้อ" class="category-tab px-6 py-2.5 rounded-xl font-semibold transition bg-gray-100 text-gray-700 hover:bg-nut/20 hover:text-nut">
                <i class="fa-solid fa-circle-nut"></i> น็อตล้อ
            </button>
            <button data-category="บูชปีกนก" class="category-tab px-6 py-2.5 rounded-xl font-semibold transition bg-gray-100 text-gray-700 hover:bg-bushing/20 hover:text-bushing">
                <i class="fa-solid fa-car-side"></i> บูชปีกนก
            </button>
            <button data-category="ยางกันฝุ่น" class="category-tab px-6 py-2.5 rounded-xl font-semibold transition bg-gray-100 text-gray-700 hover:bg-rubber/20 hover:text-rubber">
                <i class="fa-solid fa-circle"></i> ยางกันฝุ่น
            </button>
        </div>
    </div>

    <!-- สถิติ Card แยกตามประเภท -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
        <div class="bg-gradient-to-br from-orange-50 to-orange-100 rounded-2xl p-5 shadow-md border-l-4 border-nut card-hover">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-orange-700 text-sm font-semibold">📦 น็อตล้อ</p>
                    <p id="statNut" class="text-3xl font-bold text-orange-800">0</p>
                </div>
                <i class="fa-solid fa-circle-nut text-5xl text-orange-300"></i>
            </div>
        </div>
        <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-2xl p-5 shadow-md border-l-4 border-bushing card-hover">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-green-700 text-sm font-semibold">🔧 บูชปีกนก</p>
                    <p id="statBushing" class="text-3xl font-bold text-green-800">0</p>
                </div>
                <i class="fa-solid fa-car-side text-5xl text-green-300"></i>
            </div>
        </div>
        <div class="bg-gradient-to-br from-purple-50 to-purple-100 rounded-2xl p-5 shadow-md border-l-4 border-rubber card-hover">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-purple-700 text-sm font-semibold">🛞 ยางกันฝุ่น</p>
                    <p id="statRubber" class="text-3xl font-bold text-purple-800">0</p>
                </div>
                <i class="fa-solid fa-circle text-5xl text-purple-300"></i>
            </div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-md border-l-4 border-blue-500 card-hover">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">💰 มูลค่ารวมสินค้า</p>
                    <p id="totalValue" class="text-2xl font-bold text-navy">0</p>
                </div>
                <i class="fa-solid fa-coins text-4xl text-blue-200"></i>
            </div>
        </div>
    </div>

    <!-- Search & Refresh -->
    <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
        <div class="relative flex-1 max-w-md">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="ค้นหาด้วย รหัสสินค้า หรือ รายละเอียด..." 
                   class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
        </div>
        <button id="refreshBtn" class="bg-gray-100 hover:bg-gray-200 text-navy font-semibold px-5 py-2.5 rounded-xl transition flex items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i> รีเฟรช
        </button>
    </div>

    <!-- Table Card -->
    <div class="bg-white rounded-3xl p-5 md:p-6 shadow-md border border-blue-100">
        <div class="flex flex-wrap justify-between items-center mb-5 gap-3">
            <h3 class="text-lg font-bold text-navy">
                <i class="fa-solid fa-table text-primary mr-2"></i>
                <span id="categoryTitle">รายการสินค้าทั้งหมด</span>
            </h3>
            <span class="text-sm text-gray-400 bg-gray-100 px-3 py-1 rounded-full">
                <i class="fa-regular fa-clock"></i> <span id="lastUpdate">-</span>
            </span>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full min-w-[1000px] border-collapse">
                <thead class="bg-blue-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-navy font-semibold">ประเภท</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">รหัสสินค้า</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">บาร์โค้ด</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">รายละเอียด</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">ยี่ห้อ</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">ราคา</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">จำนวน</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">MOQ</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">ซัพพลายเออร์</th>
                        <th class="px-4 py-3 text-left text-navy font-semibold">สถานะ</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toastMsg" class="fixed bottom-5 right-5 bg-navy text-white px-5 py-3 rounded-full shadow-lg opacity-0 transition-opacity duration-300 z-50 pointer-events-none">
    ✅ อัปเดตข้อมูลแล้ว
</div>

<script>
    const STORAGE_KEY = "new_model_products";
    let currentProducts = [];
    let currentCategory = "all";
    let searchKeyword = "";

    // ฟังก์ชันกำหนดหมวดหมู่จาก SKU หรือ Description
    function detectCategory(product) {
        const sku = (product.sku || "").toLowerCase();
        const desc = (product.description || "").toLowerCase();
        
        if(sku.includes("nut") || desc.includes("น็อต") || desc.includes("น็อตล้อ")) {
            return "น็อตล้อ";
        }
        if(sku.includes("bush") || desc.includes("บูช") || desc.includes("ปีกนก")) {
            return "บูชปีกนก";
        }
        if(sku.includes("rubber") || desc.includes("ยาง") || desc.includes("กันฝุ่น") || desc.includes("dust cover")) {
            return "ยางกันฝุ่น";
        }
        return "อื่นๆ";
    }

    function showToast(msg, type = "success") {
        const toast = document.getElementById("toastMsg");
        toast.classList.remove("bg-navy", "bg-amber-500");
        toast.classList.add(type === "warning" ? "bg-amber-500" : "bg-navy");
        toast.textContent = msg;
        toast.classList.remove("opacity-0");
        toast.classList.add("opacity-100");
        setTimeout(() => {
            toast.classList.remove("opacity-100");
            toast.classList.add("opacity-0");
        }, 2000);
    }

    function loadProducts() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            try { 
                currentProducts = JSON.parse(stored);
                // เพิ่ม category property ให้แต่ละสินค้า
                currentProducts.forEach(prod => {
                    prod.category = detectCategory(prod);
                });
            } catch(e) { 
                currentProducts = [];
                showToast("⚠️ ข้อมูลเสียหาย", "warning");
            }
        } else {
            currentProducts = [];
        }
        
        const now = new Date();
        document.getElementById("lastUpdate").innerHTML = now.toLocaleTimeString('th-TH');
        
        updateStatistics();
        renderTable();
    }
    
    function updateStatistics() {
        let nutCount = 0;
        let bushingCount = 0;
        let rubberCount = 0;
        let totalValue = 0;
        
        currentProducts.forEach(prod => {
            const price = parseFloat(prod.price) || 0;
            const qty = parseFloat(prod.quantity) || 0;
            totalValue += price * qty;
            
            const cat = prod.category;
            if(cat === "น็อตล้อ") nutCount++;
            else if(cat === "บูชปีกนก") bushingCount++;
            else if(cat === "ยางกันฝุ่น") rubberCount++;
        });
        
        document.getElementById("statNut").innerHTML = nutCount;
        document.getElementById("statBushing").innerHTML = bushingCount;
        document.getElementById("statRubber").innerHTML = rubberCount;
        document.getElementById("totalValue").innerHTML = "฿ " + totalValue.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    
    function getFilteredProducts() {
        let filtered = [...currentProducts];
        
        // กรองตามหมวดหมู่
        if(currentCategory !== "all") {
            filtered = filtered.filter(prod => prod.category === currentCategory);
        }
        
        // กรองตามคำค้นหา
        if(searchKeyword.trim() !== "") {
            const keyword = searchKeyword.toLowerCase().trim();
            filtered = filtered.filter(prod => 
                (prod.sku && prod.sku.toLowerCase().includes(keyword)) ||
                (prod.description && prod.description.toLowerCase().includes(keyword)) ||
                (prod.barcode && prod.barcode.toLowerCase().includes(keyword))
            );
        }
        
        return filtered;
    }
    
    function escapeHtml(str) {
        if(!str) return "-";
        return String(str).replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    
    function formatPrice(price) {
        if(price === "" || price === undefined || price === null) return "-";
        const num = parseFloat(price);
        if(isNaN(num)) return "-";
        return `฿ ${num.toFixed(2)}`;
    }
    
    function getCategoryBadge(category) {
        let colorClass = "bg-gray-100 text-gray-700";
        let icon = "fa-tag";
        
        if(category === "น็อตล้อ") {
            colorClass = "bg-orange-100 text-orange-700";
            icon = "fa-circle-nut";
        } else if(category === "บูชปีกนก") {
            colorClass = "bg-green-100 text-green-700";
            icon = "fa-car-side";
        } else if(category === "ยางกันฝุ่น") {
            colorClass = "bg-purple-100 text-purple-700";
            icon = "fa-circle";
        }
        
        return `<span class="${colorClass} px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1 w-fit">
                    <i class="fa-solid ${icon}"></i> ${escapeHtml(category)}
                </span>`;
    }
    
    function getStatusBadge(status) {
        let colorClass = "bg-blue-100 text-blue-700";
        if(status === "เสร็จสมบูรณ์") colorClass = "bg-green-100 text-green-700";
        else if(status === "อยู่ในขั้นตอนผลิต") colorClass = "bg-yellow-100 text-yellow-700";
        else if(status === "ขั้นตอนวาด Drawing") colorClass = "bg-purple-100 text-purple-700";
        
        return `<span class="${colorClass} px-3 py-1 rounded-full text-xs font-medium">${escapeHtml(status)}</span>`;
    }
    
    function renderTable() {
        const tbody = document.getElementById("tableBody");
        if(!tbody) return;
        tbody.innerHTML = "";
        
        const filtered = getFilteredProducts();
        
        // อัปเดตหัวข้อตามหมวดหมู่
        const titleMap = {
            "all": "รายการสินค้าทั้งหมด",
            "น็อตล้อ": "📦 รายการสินค้า น็อตล้อ",
            "บูชปีกนก": "🔧 รายการสินค้า บูชปีกนก",
            "ยางกันฝุ่น": "🛞 รายการสินค้า ยางกันฝุ่น"
        };
        document.getElementById("categoryTitle").innerHTML = titleMap[currentCategory] || titleMap["all"];
        
        if(filtered.length === 0) {
            const row = tbody.insertRow();
            const cell = row.insertCell(0);
            cell.colSpan = 10;
            cell.textContent = currentCategory !== "all" ? 
                `⚠️ ไม่พบสินค้าในหมวด "${currentCategory}"` : 
                "⚠️ ไม่มีข้อมูลสินค้า กรุณาไปเพิ่มที่หน้า NEW MODEL";
            cell.className = "text-center py-10 text-gray-400";
            return;
        }
        
        filtered.forEach((prod) => {
            const row = tbody.insertRow();
            row.className = "border-b border-gray-100 hover:bg-blue-50/50 transition";
            
            row.insertCell(0).innerHTML = `<div class="px-4 py-3">${getCategoryBadge(prod.category)}</div>`;
            row.insertCell(1).innerHTML = `<div class="px-4 py-3 font-medium">${escapeHtml(prod.sku) || "-"}</div>`;
            row.insertCell(2).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.barcode) || "-"}</div>`;
            row.insertCell(3).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.description) || "-"}</div>`;
            row.insertCell(4).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.brand) || "-"}</div>`;
            row.insertCell(5).innerHTML = `<div class="px-4 py-3 font-mono">${formatPrice(prod.price)}</div>`;
            row.insertCell(6).innerHTML = `<div class="px-4 py-3 text-right">${(prod.quantity !== "" && prod.quantity !== undefined) ? parseInt(prod.quantity).toLocaleString() : "0"}</div>`;
            row.insertCell(7).innerHTML = `<div class="px-4 py-3 text-right">${(prod.moq !== "" && prod.moq !== undefined) ? parseInt(prod.moq).toLocaleString() : "-"}</div>`;
            row.insertCell(8).innerHTML = `<div class="px-4 py-3">${escapeHtml(prod.supplier) || "-"}</div>`;
            row.insertCell(9).innerHTML = `<div class="px-4 py-3">${getStatusBadge(prod.status)}</div>`;
        });
    }
    
    function refreshData() {
        loadProducts();
        showToast("🔄 รีเฟรชข้อมูลสำเร็จ");
    }
    
    // Event handlers
    let autoRefreshInterval = null;
    
    function startAutoRefresh() {
        if(autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(() => {
            loadProducts();
            console.log("Auto-refresh: โหลดข้อมูลล่าสุด");
        }, 10000);
    }
    
    function stopAutoRefresh() {
        if(autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }
    }
    
    // จัดการ Category Tabs
    document.querySelectorAll(".category-tab").forEach(tab => {
        tab.addEventListener("click", function() {
            document.querySelectorAll(".category-tab").forEach(t => {
                t.classList.remove("active");
                t.classList.add("bg-gray-100", "text-gray-700");
                t.classList.remove("bg-gradient-to-r", "from-primary", "to-primaryDark", "text-white", "shadow-md");
            });
            this.classList.remove("bg-gray-100", "text-gray-700");
            this.classList.add("active", "bg-gradient-to-r", "from-primary", "to-primaryDark", "text-white", "shadow-md");
            
            currentCategory = this.getAttribute("data-category");
            renderTable();
        });
    });
    
    // Search input
    document.getElementById("searchInput").addEventListener("input", function(e) {
        searchKeyword = e.target.value;
        renderTable();
    });
    
    // เริ่มต้น
    loadProducts();
    startAutoRefresh();
    document.getElementById("refreshBtn").addEventListener("click", refreshData);
    
    window.addEventListener("beforeunload", function() {
        stopAutoRefresh();
    });
    
    console.log("✅ nut2.html พร้อมทำงาน | รองรับหมวดหมู่: น็อตล้อ, บูชปีกนก, ยางกันฝุ่น");
</script>
</body>
</html>
